name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  secret-preflight:
    name: Secret Preflight
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check env and docs for leaked mail secrets
        run: bash scripts/security/check-env-secrets.sh

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: npm

      - name: Install frontend deps
        run: npm ci --legacy-peer-deps

      - name: Frontend security audit (high)
        run: npm run security:audit

      - name: Frontend quality gate
        run: npm run check

  backend-quality:
    name: Backend Test And Pint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer:v2
          extensions: mbstring, pdo_pgsql, pgsql, pdo_sqlite, sqlite3, dom, curl, fileinfo, zip
          coverage: none

      - name: Install backend deps
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare app key
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Run backend tests
        run: php artisan test

      - name: Run Pint check
        run: ./vendor/bin/pint --test

  build-production-images:
    name: Build Release Images
    runs-on: ubuntu-latest
    needs:
      - secret-preflight
      - frontend-build
      - backend-quality
    if: >
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (
        github.ref == 'refs/heads/main' ||
        github.ref == 'refs/heads/backup/vps-ready-20260430' ||
        github.ref == 'refs/heads/staging'
      )
    outputs:
      backend_image: ${{ steps.images.outputs.backend_image }}
      nginx_image: ${{ steps.images.outputs.nginx_image }}
      caddy_image: ${{ steps.images.outputs.caddy_image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Define image tags
        id: images
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY,,}"
          branch_tag="$(printf '%s' "$GITHUB_REF_NAME" | tr '[:upper:]/' '[:lower:]-' | tr -cd 'a-z0-9._-')"
          branch_tag="${branch_tag:-release}"

          backend_image="ghcr.io/${repo}/backend:${GITHUB_SHA}"
          nginx_image="ghcr.io/${repo}/nginx:${GITHUB_SHA}"
          caddy_image="ghcr.io/${repo}/caddy:${GITHUB_SHA}"
          backend_branch_image="ghcr.io/${repo}/backend:${branch_tag}"
          nginx_branch_image="ghcr.io/${repo}/nginx:${branch_tag}"
          caddy_branch_image="ghcr.io/${repo}/caddy:${branch_tag}"

          {
            echo "BACKEND_IMAGE=${backend_image}"
            echo "NGINX_IMAGE=${nginx_image}"
            echo "CADDY_IMAGE=${caddy_image}"
            echo "BACKEND_BRANCH_IMAGE=${backend_branch_image}"
            echo "NGINX_BRANCH_IMAGE=${nginx_branch_image}"
            echo "CADDY_BRANCH_IMAGE=${caddy_branch_image}"
          } >> "$GITHUB_ENV"

          {
            echo "backend_image=${backend_image}"
            echo "nginx_image=${nginx_image}"
            echo "caddy_image=${caddy_image}"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push backend image
        run: |
          set -euo pipefail
          docker buildx build \
            --file backend/docker/Dockerfile.prod \
            --tag "$BACKEND_IMAGE" \
            --tag "$BACKEND_BRANCH_IMAGE" \
            --cache-from type=gha,scope=backend-prod \
            --cache-to type=gha,mode=max,scope=backend-prod \
            --push \
            .

      - name: Build and push nginx image
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_TENANT_SLUG: ${{ vars.VITE_TENANT_SLUG }}
          VITE_ROOT_DOMAIN: ${{ vars.VITE_ROOT_DOMAIN || secrets.VITE_ROOT_DOMAIN }}
          VITE_ADMIN_SUBDOMAIN: ${{ vars.VITE_ADMIN_SUBDOMAIN || secrets.VITE_ADMIN_SUBDOMAIN }}
          VITE_REALTIME_POLL_MS: ${{ vars.VITE_REALTIME_POLL_MS }}
          VITE_REALTIME_POLL_HIDDEN_MS: ${{ vars.VITE_REALTIME_POLL_HIDDEN_MS }}
          VITE_GOOGLE_AUTH_ENABLED: ${{ vars.VITE_GOOGLE_AUTH_ENABLED }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_AUTH_LOGIN_URL: ${{ vars.VITE_GOOGLE_AUTH_LOGIN_URL }}
          VITE_GOOGLE_AUTH_LINK_URL: ${{ vars.VITE_GOOGLE_AUTH_LINK_URL }}
          VITE_USE_ASSIGNMENTS_API_V2: ${{ github.ref == 'refs/heads/staging' && vars.VITE_USE_ASSIGNMENTS_API_V2 || 'false' }}
          VITE_USE_ASSIGNMENT_UPLOADS_API_V2: ${{ github.ref == 'refs/heads/staging' && vars.VITE_USE_ASSIGNMENT_UPLOADS_API_V2 || 'false' }}
        run: |
          set -euo pipefail
          docker buildx build \
            --file deploy/nginx/Dockerfile.prod \
            --build-arg VITE_API_URL="${VITE_API_URL:-}" \
            --build-arg VITE_TENANT_SLUG="${VITE_TENANT_SLUG:-}" \
            --build-arg VITE_ROOT_DOMAIN="${VITE_ROOT_DOMAIN:-}" \
            --build-arg VITE_ADMIN_SUBDOMAIN="${VITE_ADMIN_SUBDOMAIN:-admin26}" \
            --build-arg VITE_REALTIME_POLL_MS="${VITE_REALTIME_POLL_MS:-4000}" \
            --build-arg VITE_REALTIME_POLL_HIDDEN_MS="${VITE_REALTIME_POLL_HIDDEN_MS:-12000}" \
            --build-arg VITE_GOOGLE_AUTH_ENABLED="${VITE_GOOGLE_AUTH_ENABLED:-false}" \
            --build-arg VITE_GOOGLE_CLIENT_ID="${VITE_GOOGLE_CLIENT_ID:-}" \
            --build-arg VITE_GOOGLE_AUTH_LOGIN_URL="${VITE_GOOGLE_AUTH_LOGIN_URL:-/api/auth/google/redirect}" \
            --build-arg VITE_GOOGLE_AUTH_LINK_URL="${VITE_GOOGLE_AUTH_LINK_URL:-/api/auth/google/link}" \
            --build-arg VITE_USE_ASSIGNMENTS_API_V2="${VITE_USE_ASSIGNMENTS_API_V2:-false}" \
            --build-arg VITE_USE_ASSIGNMENT_UPLOADS_API_V2="${VITE_USE_ASSIGNMENT_UPLOADS_API_V2:-false}" \
            --tag "$NGINX_IMAGE" \
            --tag "$NGINX_BRANCH_IMAGE" \
            --cache-from type=gha,scope=nginx-prod \
            --cache-to type=gha,mode=max,scope=nginx-prod \
            --push \
            .

      - name: Build and push Caddy WAF image
        run: |
          set -euo pipefail
          docker buildx build \
            --file deploy/caddy/Dockerfile \
            --tag "$CADDY_IMAGE" \
            --tag "$CADDY_BRANCH_IMAGE" \
            --cache-from type=gha,scope=caddy-waf-prod \
            --cache-to type=gha,mode=max,scope=caddy-waf-prod \
            --push \
            .

      - name: Validate Caddy WAF config
        run: |
          set -euo pipefail
          docker pull "$CADDY_IMAGE"
          docker run --rm \
            -e CADDY_ACME_EMAIL=ops@sismu.biz.id \
            -e CADDY_ASK_SECRET=ci-validate-only \
            -e CADDY_EVOLUTION_HOST=wa.sismu.biz.id \
            -e CADDY_APP_HOSTS=sismu.biz.id \
            -e CADDY_ROOT_DOMAIN=sismu.biz.id \
            -e CADDY_HTTPS_PORT_SUFFIX= \
            -e TENANT_EDGE_PROXY_SECRET=ci-edge-secret-validation-only \
            -v "$PWD/deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            "$CADDY_IMAGE" \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

  deploy-production:
    name: Deploy To VPS
    runs-on: ubuntu-latest
    needs:
      - build-production-images
    if: >
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (
        github.ref == 'refs/heads/main' ||
        github.ref == 'refs/heads/backup/vps-ready-20260430' ||
        github.ref == 'refs/heads/staging'
      )
    concurrency:
      group: ${{ github.ref == 'refs/heads/staging' && 'staging-deploy' || 'production-deploy' }}
      cancel-in-progress: false
    environment: ${{ github.ref == 'refs/heads/staging' && 'staging' || 'production' }}

    steps:
      - name: Validate deploy secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
        run: |
          set -euo pipefail
          missing=0
          for name in VPS_HOST VPS_USER VPS_SSH_PRIVATE_KEY VPS_APP_DIR; do
            if [ -z "${!name:-}" ]; then
              echo "::error title=Missing deploy secret::${name} is required"
              missing=1
            fi
          done
          exit "$missing"

      - name: Prepare SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          port="${VPS_PORT:-22}"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/edusmart_deploy_key
          chmod 600 ~/.ssh/edusmart_deploy_key
          : > ~/.ssh/known_hosts
          for attempt in 1 2 3 4 5; do
            if ssh-keyscan -T 20 -t ed25519 -p "$port" "$VPS_HOST" >> ~/.ssh/known_hosts; then
              sort -u ~/.ssh/known_hosts -o ~/.ssh/known_hosts
              break
            fi

            if [ "$attempt" -eq 5 ]; then
              echo "::error title=SSH host key scan failed::Unable to read VPS SSH host key after ${attempt} attempts"
              exit 1
            fi

            sleep $((attempt * 5))
          done
          sleep 5

      - name: Verify SSH access
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          port="${VPS_PORT:-22}"
          ssh -i ~/.ssh/edusmart_deploy_key -p "$port" \
            -o BatchMode=yes \
            -o ConnectionAttempts=3 \
            -o ConnectTimeout=20 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            "printf 'SSH_OK\n'"

      - name: Transfer release images to VPS
        env:
          EDUSMART_BACKEND_IMAGE: ${{ needs.build-production-images.outputs.backend_image }}
          EDUSMART_NGINX_IMAGE: ${{ needs.build-production-images.outputs.nginx_image }}
          EDUSMART_CADDY_IMAGE: ${{ needs.build-production-images.outputs.caddy_image }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          port="${VPS_PORT:-22}"
          ssh_opts=(
            -i ~/.ssh/edusmart_deploy_key
            -p "$port"
            -o BatchMode=yes
            -o ConnectionAttempts=3
            -o ConnectTimeout=20
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
          )
          images=(
            "$EDUSMART_BACKEND_IMAGE"
            "$EDUSMART_NGINX_IMAGE"
            "$EDUSMART_CADDY_IMAGE"
          )

          printf "%s" "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
          for image in "${images[@]}"; do
            docker pull "$image"
          done

          ssh "${ssh_opts[@]}" "$VPS_USER@$VPS_HOST" \
            'docker system prune -af || true; df -h /; docker system df || true'

          docker save "${images[@]}" | gzip -1 | ssh "${ssh_opts[@]}" "$VPS_USER@$VPS_HOST" \
            'gunzip | docker load'

          for image in "${images[@]}"; do
            ssh "${ssh_opts[@]}" "$VPS_USER@$VPS_HOST" \
              "docker image inspect '$image' >/dev/null"
          done

      - name: Deploy release on VPS
        env:
          RELEASE_REF: ${{ github.sha }}
          RELEASE_BRANCH: ${{ github.ref_name }}
          EDUSMART_BACKEND_IMAGE: ${{ needs.build-production-images.outputs.backend_image }}
          EDUSMART_NGINX_IMAGE: ${{ needs.build-production-images.outputs.nginx_image }}
          EDUSMART_CADDY_IMAGE: ${{ needs.build-production-images.outputs.caddy_image }}
          PRELOADED_RELEASE_IMAGES: "true"
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
        run: |
          set -euo pipefail
          port="${VPS_PORT:-22}"
          deploy_log="$(mktemp)"

          set +e
          {
            printf 'set -Eeuo pipefail\n'
            printf 'REMOTE_DIR=%q\n' "$VPS_APP_DIR"
            printf 'RELEASE_REF=%q\n' "$RELEASE_REF"
            printf 'RELEASE_BRANCH=%q\n' "$RELEASE_BRANCH"
            printf 'BACKEND_IMAGE=%q\n' "$EDUSMART_BACKEND_IMAGE"
            printf 'NGINX_IMAGE=%q\n' "$EDUSMART_NGINX_IMAGE"
            printf 'CADDY_IMAGE=%q\n' "$EDUSMART_CADDY_IMAGE"
            printf 'PRELOADED_IMAGES=%q\n' "${PRELOADED_RELEASE_IMAGES:-false}"
            printf 'GHCR_USERNAME=%q\n' "${GHCR_USERNAME:-}"
            printf 'GHCR_TOKEN=%q\n' "${GHCR_TOKEN:-}"
            printf '%s\n' \
              'cd "$REMOTE_DIR"' \
              'git update-index --skip-worktree -- deploy/mosquitto/generated/.gitignore deploy/mosquitto/generated/.gitkeep 2>/dev/null || true' \
              'diagnose_remote_failure() {' \
              '  status="$?"' \
              '  echo "[diagnostic] Remote deploy gagal dengan exit ${status}."' \
              '  git update-index --skip-worktree -- deploy/mosquitto/generated/.gitignore deploy/mosquitto/generated/.gitkeep 2>/dev/null || true' \
              '  git status --short -- . ":!deploy/mosquitto/generated" ":!backups" ":!.env.production" || true' \
              '  df -h / || true' \
              '  docker system df || true' \
              '  exit "$status"' \
              '}' \
              'trap diagnose_remote_failure ERR' \
              'retry_docker_login() {' \
              '  attempt=1' \
              '  max_attempts=5' \
              '  delay=8' \
              '  until printf "%s" "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin; do' \
              '    if [ "$attempt" -ge "$max_attempts" ]; then' \
              '      echo "[preflight] Docker login GHCR gagal setelah ${max_attempts} percobaan." >&2' \
              '      return 1' \
              '    fi' \
              '    echo "[preflight] Docker login GHCR timeout/gagal; retry $((attempt + 1))/${max_attempts} dalam ${delay}s..." >&2' \
              '    sleep "$delay"' \
              '    attempt=$((attempt + 1))' \
              '    delay=$((delay * 2))' \
              '  done' \
              '}' \
              'retry_command() {' \
              '  label="$1"' \
              '  max_attempts="${2:-3}"' \
              '  delay="${3:-10}"' \
              '  shift 3' \
              '  attempt=1' \
              '  until "$@"; do' \
              '    if [ "$attempt" -ge "$max_attempts" ]; then' \
              '      echo "[preflight] ${label} gagal setelah ${max_attempts} percobaan." >&2' \
              '      return 1' \
              '    fi' \
              '    echo "[preflight] ${label} gagal/timeout; retry $((attempt + 1))/${max_attempts} dalam ${delay}s..." >&2' \
              '    sleep "$delay"' \
              '    attempt=$((attempt + 1))' \
              '    delay=$((delay * 2))' \
              '  done' \
              '}' \
              'if [ "${PRELOADED_IMAGES:-false}" = "true" ]; then' \
              '  echo "[preflight] Release image sudah dimuat dari CI runner; lewati pull/login registry di VPS."' \
              '  df -h / || true' \
              'else' \
              '  echo "[preflight] Bersihkan image/cache Docker tidak terpakai sebelum fetch release dan login registry..."' \
              '  docker system prune -af || true' \
              '  df -h / || true' \
              '  if [ -n "$GHCR_USERNAME" ] && [ -n "$GHCR_TOKEN" ]; then' \
              '    retry_docker_login' \
              '  fi' \
              'fi' \
              'unset GHCR_TOKEN' \
              'if [ -n "$RELEASE_BRANCH" ]; then' \
              '  retry_command "git fetch branch release" 3 15 git fetch origin "+refs/heads/${RELEASE_BRANCH}:refs/remotes/origin/${RELEASE_BRANCH}" --tags --prune || retry_command "git fetch semua ref" 3 15 git fetch --all --tags --prune' \
              'else' \
              '  retry_command "git fetch semua ref" 3 15 git fetch --all --tags --prune' \
              'fi' \
              'if ! git cat-file -e "${RELEASE_REF}^{commit}" 2>/dev/null; then' \
              '  retry_command "git fetch commit release" 3 15 git fetch origin "$RELEASE_REF" || true' \
              'fi' \
              'git rev-parse --verify "${RELEASE_REF}^{commit}" >/dev/null' \
              'tmp_script="$(mktemp)"' \
              'trap '"'"'rm -f "$tmp_script"'"'"' EXIT' \
              'git show "$RELEASE_REF":deploy/release-prod.sh > "$tmp_script"' \
              'chmod +x "$tmp_script"' \
              'pull_flag="--pull-images"' \
              'if [ "${PRELOADED_IMAGES:-false}" = "true" ]; then' \
              '  pull_flag="--no-pull-images"' \
              'fi' \
              'EDUSMART_SKIP_RELEASE_FETCH=true EDUSMART_BACKEND_IMAGE="$BACKEND_IMAGE" EDUSMART_NGINX_IMAGE="$NGINX_IMAGE" EDUSMART_CADDY_IMAGE="$CADDY_IMAGE" EDUSMART_ROOT_DIR="$REMOTE_DIR" "$tmp_script" --ref "$RELEASE_REF" "$pull_flag"'
          } | ssh -i ~/.ssh/edusmart_deploy_key -p "$port" \
            -o BatchMode=yes \
            -o ConnectionAttempts=3 \
            -o ConnectTimeout=20 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            "bash -s" 2>&1 | tee "$deploy_log"
          deploy_status="${PIPESTATUS[1]}"
          set -e

          if [ "$deploy_status" -ne 0 ]; then
            message="$(tail -n 80 "$deploy_log" | sed -E 's/%/%25/g; s/::/%3A%3A/g; s/\r/%0D/g' | awk '{printf "%s%%0A", $0}')"
            echo "::error title=Remote deploy failed::${message}"
            exit "$deploy_status"
          fi
