name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: npm

      - name: Install frontend deps
        run: npm ci

      - name: Frontend security audit (high)
        run: npm run security:audit

      - name: Frontend quality gate
        run: npm run check

  backend-quality:
    name: Backend Test And Pint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer:v2
          extensions: mbstring, pdo_sqlite, sqlite3, dom, curl, fileinfo
          coverage: none

      - name: Install backend deps
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare app key
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Run backend tests
        run: php artisan test

      - name: Run Pint check
        run: ./vendor/bin/pint --test

  deploy-production:
    name: Deploy To VPS
    runs-on: ubuntu-latest
    needs:
      - frontend-build
      - backend-quality
    if: >
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/backup/vps-ready-20260430')
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    environment: production

    steps:
      - name: Validate deploy secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
        run: |
          set -euo pipefail
          missing=0
          for name in VPS_HOST VPS_USER VPS_SSH_PRIVATE_KEY VPS_APP_DIR; do
            if [ -z "${!name:-}" ]; then
              echo "::error title=Missing deploy secret::${name} is required"
              missing=1
            fi
          done
          exit "$missing"

      - name: Prepare SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          port="${VPS_PORT:-22}"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/edusmart_deploy_key
          chmod 600 ~/.ssh/edusmart_deploy_key
          ssh-keyscan -p "$port" "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Deploy release on VPS
        env:
          RELEASE_REF: ${{ github.sha }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
        run: |
          set -euo pipefail
          port="${VPS_PORT:-22}"
          remote_dir="$(printf '%q' "$VPS_APP_DIR")"
          release_ref="$(printf '%q' "$RELEASE_REF")"

          ssh -i ~/.ssh/edusmart_deploy_key -p "$port" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            "set -Eeuo pipefail
             cd $remote_dir
             git fetch --all --tags --prune
             git rev-parse --verify $release_ref >/dev/null
             tmp_script=\"\$(mktemp)\"
             trap 'rm -f \"\$tmp_script\"' EXIT
             git show $release_ref:deploy/release-prod.sh > \"\$tmp_script\"
             chmod +x \"\$tmp_script\"
             EDUSMART_ROOT_DIR=$remote_dir \"\$tmp_script\" --ref $release_ref"
