name: Build Production Images

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Tag image yang akan dipush ke GHCR"
        required: true
        default: "latest"

permissions:
  contents: read
  packages: write

jobs:
  build-images:
    name: Build And Push Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image names and tags
        id: image
        shell: bash
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY,,}"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            tag="${{ inputs.image_tag }}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="latest"
          fi
          tag="${tag//\//-}"
          sha_tag="sha-${GITHUB_SHA::12}"

          {
            echo "backend_tags<<EOF"
            echo "ghcr.io/${repo}/backend:${tag}"
            echo "ghcr.io/${repo}/backend:${sha_tag}"
            echo "EOF"
            echo "nginx_tags<<EOF"
            echo "ghcr.io/${repo}/nginx:${tag}"
            echo "ghcr.io/${repo}/nginx:${sha_tag}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/docker/Dockerfile.prod
          push: true
          tags: ${{ steps.image.outputs.backend_tags }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push nginx/frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/nginx/Dockerfile.prod
          push: true
          tags: ${{ steps.image.outputs.nginx_tags }}
          cache-from: type=gha,scope=nginx
          cache-to: type=gha,mode=max,scope=nginx
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL }}
            VITE_TENANT_SLUG=${{ vars.VITE_TENANT_SLUG }}
            VITE_ROOT_DOMAIN=${{ vars.VITE_ROOT_DOMAIN }}
            VITE_ADMIN_SUBDOMAIN=${{ vars.VITE_ADMIN_SUBDOMAIN || 'admin' }}
            VITE_REALTIME_POLL_MS=${{ vars.VITE_REALTIME_POLL_MS || '4000' }}
            VITE_REALTIME_POLL_HIDDEN_MS=${{ vars.VITE_REALTIME_POLL_HIDDEN_MS || '12000' }}
            VITE_GOOGLE_AUTH_ENABLED=${{ vars.VITE_GOOGLE_AUTH_ENABLED || 'false' }}
            VITE_GOOGLE_CLIENT_ID=${{ vars.VITE_GOOGLE_CLIENT_ID }}
            VITE_GOOGLE_AUTH_LOGIN_URL=${{ vars.VITE_GOOGLE_AUTH_LOGIN_URL || '/api/auth/google/redirect' }}
            VITE_GOOGLE_AUTH_LINK_URL=${{ vars.VITE_GOOGLE_AUTH_LINK_URL || '/api/auth/google/link' }}
