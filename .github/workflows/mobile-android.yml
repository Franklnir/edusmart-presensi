name: Mobile Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
      - 'mobile-*'
    paths:
      - 'mobile-app/**'

permissions:
  contents: read

jobs:
  android:
    name: Android APK/AAB
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-app
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: mobile-app/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test -- --runInBand

      - name: Prebuild Android native project
        env:
          CI: true
        run: npx expo prebuild --platform android --clean

      - name: Set Android app version
        run: |
          set -euo pipefail
          VERSION_NAME="$(node -p "require('./package.json').version")"
          VERSION_CODE="${GITHUB_RUN_NUMBER}"
          VERSION_NAME="$VERSION_NAME" VERSION_CODE="$VERSION_CODE" node <<'NODE'
          const fs = require('fs');
          const path = 'android/app/build.gradle';
          let text = fs.readFileSync(path, 'utf8');
          text = text.replace(/versionCode\s+\d+/g, `versionCode ${process.env.VERSION_CODE}`);
          text = text.replace(/versionName\s+["'][^"']+["']/g, `versionName "${process.env.VERSION_NAME}"`);
          fs.writeFileSync(path, text);
          NODE
          echo "MOBILE_VERSION_NAME=${VERSION_NAME}" >> "$GITHUB_ENV"
          echo "MOBILE_VERSION_CODE=${VERSION_CODE}" >> "$GITHUB_ENV"

      - name: Bundle Android JS for standalone debug APK
        run: |
          set -euo pipefail
          npm run bundle:android:standalone
          test -s android/app/src/main/assets/index.android.bundle

      - name: Build standalone debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon

      - name: Prepare debug APK artifact
        run: |
          set -euo pipefail
          mkdir -p build/artifacts/android/debug
          APK_SOURCE="$(find android/app/build/outputs/apk/debug -name '*.apk' | head -n 1)"
          test -n "$APK_SOURCE"
          cp "$APK_SOURCE" "build/artifacts/android/debug/sismu-mobile-${MOBILE_VERSION_NAME}-build${MOBILE_VERSION_CODE}-debug.apk"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mobile-app-android-debug-apk
          path: mobile-app/build/artifacts/android/debug/*.apk
          if-no-files-found: error

      - name: Configure Android release signing
        if: >
          env.ANDROID_KEYSTORE_BASE64 != '' &&
          env.ANDROID_KEYSTORE_PASSWORD != '' &&
          env.ANDROID_KEY_ALIAS != '' &&
          env.ANDROID_KEY_PASSWORD != ''
        run: |
          set -euo pipefail
          install -m 700 -d android/app/keystores
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/keystores/release.keystore
          chmod 600 android/app/keystores/release.keystore

          {
            echo 'EDUSMART_RELEASE_STORE_FILE=keystores/release.keystore'
            echo "EDUSMART_RELEASE_STORE_PASSWORD=${ANDROID_KEYSTORE_PASSWORD}"
            echo "EDUSMART_RELEASE_KEY_ALIAS=${ANDROID_KEY_ALIAS}"
            echo "EDUSMART_RELEASE_KEY_PASSWORD=${ANDROID_KEY_PASSWORD}"
          } >> android/gradle.properties

          cat >> android/app/build.gradle <<'GRADLE'

          if (project.hasProperty("EDUSMART_RELEASE_STORE_FILE")) {
              def edusmartReleaseSigning = android.signingConfigs.maybeCreate("edusmartRelease")
              edusmartReleaseSigning.storeFile = file(project.property("EDUSMART_RELEASE_STORE_FILE"))
              edusmartReleaseSigning.storePassword = project.property("EDUSMART_RELEASE_STORE_PASSWORD")
              edusmartReleaseSigning.keyAlias = project.property("EDUSMART_RELEASE_KEY_ALIAS")
              edusmartReleaseSigning.keyPassword = project.property("EDUSMART_RELEASE_KEY_PASSWORD")
              android.buildTypes.release.signingConfig = edusmartReleaseSigning
          }
          GRADLE

      - name: Build signed release APK and AAB
        if: >
          env.ANDROID_KEYSTORE_BASE64 != '' &&
          env.ANDROID_KEYSTORE_PASSWORD != '' &&
          env.ANDROID_KEY_ALIAS != '' &&
          env.ANDROID_KEY_PASSWORD != ''
        run: cd android && ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Prepare release artifacts
        if: >
          env.ANDROID_KEYSTORE_BASE64 != '' &&
          env.ANDROID_KEYSTORE_PASSWORD != '' &&
          env.ANDROID_KEY_ALIAS != '' &&
          env.ANDROID_KEY_PASSWORD != ''
        run: |
          set -euo pipefail
          mkdir -p build/artifacts/android/release
          APK_SOURCE="$(find android/app/build/outputs/apk/release -name '*.apk' | head -n 1)"
          AAB_SOURCE="$(find android/app/build/outputs/bundle/release -name '*.aab' | head -n 1)"
          test -n "$APK_SOURCE"
          test -n "$AAB_SOURCE"
          cp "$APK_SOURCE" "build/artifacts/android/release/sismu-mobile-${MOBILE_VERSION_NAME}-build${MOBILE_VERSION_CODE}-release.apk"
          cp "$AAB_SOURCE" "build/artifacts/android/release/sismu-mobile-${MOBILE_VERSION_NAME}-build${MOBILE_VERSION_CODE}-release.aab"

      - name: Upload release APK
        if: >
          env.ANDROID_KEYSTORE_BASE64 != '' &&
          env.ANDROID_KEYSTORE_PASSWORD != '' &&
          env.ANDROID_KEY_ALIAS != '' &&
          env.ANDROID_KEY_PASSWORD != ''
        uses: actions/upload-artifact@v4
        with:
          name: mobile-app-android-release-apk
          path: mobile-app/build/artifacts/android/release/*.apk
          if-no-files-found: error

      - name: Upload release AAB
        if: >
          env.ANDROID_KEYSTORE_BASE64 != '' &&
          env.ANDROID_KEYSTORE_PASSWORD != '' &&
          env.ANDROID_KEY_ALIAS != '' &&
          env.ANDROID_KEY_PASSWORD != ''
        uses: actions/upload-artifact@v4
        with:
          name: mobile-app-android-release-aab
          path: mobile-app/build/artifacts/android/release/*.aab
          if-no-files-found: error

      - name: Release signing skipped
        if: >
          env.ANDROID_KEYSTORE_BASE64 == '' ||
          env.ANDROID_KEYSTORE_PASSWORD == '' ||
          env.ANDROID_KEY_ALIAS == '' ||
          env.ANDROID_KEY_PASSWORD == ''
        run: |
          echo 'Android release signing secrets are incomplete; debug APK artifact was still uploaded.'
