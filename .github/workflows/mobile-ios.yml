name: Mobile iOS Optional

on:
  workflow_dispatch:
    inputs:
      export_method:
        description: 'iOS export method: development, ad-hoc, app-store, or enterprise'
        required: false
        default: development

permissions:
  contents: read

jobs:
  ios:
    name: Optional iOS IPA
    runs-on: macos-15
    defaults:
      run:
        working-directory: mobile-app
    env:
      IOS_BUILD_CERTIFICATE_BASE64: ${{ secrets.IOS_BUILD_CERTIFICATE_BASE64 }}
      IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
      IOS_BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_BUILD_PROVISION_PROFILE_BASE64 }}
      IOS_KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: mobile-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test -- --runInBand

      - name: Check iOS signing secrets
        id: signing
        run: |
          set -euo pipefail
          if [ -n "${IOS_BUILD_CERTIFICATE_BASE64:-}" ] \
            && [ -n "${IOS_P12_PASSWORD:-}" ] \
            && [ -n "${IOS_BUILD_PROVISION_PROFILE_BASE64:-}" ] \
            && [ -n "${IOS_KEYCHAIN_PASSWORD:-}" ]; then
            echo 'can_build=true' >> "$GITHUB_OUTPUT"
          else
            echo 'can_build=false' >> "$GITHUB_OUTPUT"
            echo '::notice title=iOS build skipped::Apple signing secrets are incomplete. Add certificate/provisioning secrets and rerun this manual workflow to build an IPA.'
          fi

      - name: Install Apple certificate and provisioning profile
        if: steps.signing.outputs.can_build == 'true'
        run: |
          set -euo pipefail
          cert_path="$RUNNER_TEMP/ios-build-certificate.p12"
          profile_path="$RUNNER_TEMP/ios-build-profile.mobileprovision"
          keychain_path="$RUNNER_TEMP/ios-build.keychain-db"
          profile_plist="$RUNNER_TEMP/ios-build-profile.plist"

          printf '%s' "$IOS_BUILD_CERTIFICATE_BASE64" | base64 --decode > "$cert_path"
          printf '%s' "$IOS_BUILD_PROVISION_PROFILE_BASE64" | base64 --decode > "$profile_path"

          security create-keychain -p "$IOS_KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$IOS_KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$cert_path" -P "$IOS_P12_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security list-keychains -d user -s "$keychain_path"

          security cms -D -i "$profile_path" > "$profile_plist"
          profile_uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$profile_plist")"
          profile_name="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$profile_plist")"
          team_id="$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$profile_plist")"

          install -m 700 -d "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$profile_path" "$HOME/Library/MobileDevice/Provisioning Profiles/${profile_uuid}.mobileprovision"

          {
            echo "IOS_PROFILE_NAME=${profile_name}"
            echo "IOS_TEAM_ID=${team_id}"
          } >> "$GITHUB_ENV"

      - name: Prebuild iOS native project
        if: steps.signing.outputs.can_build == 'true'
        env:
          CI: true
        run: npx expo prebuild --platform ios --clean

      - name: Build iOS archive
        if: steps.signing.outputs.can_build == 'true'
        run: |
          set -euo pipefail
          workspace="$(find ios -maxdepth 1 -name '*.xcworkspace' | head -n 1)"
          if [ -z "$workspace" ]; then
            echo 'No Xcode workspace generated by Expo prebuild.' >&2
            exit 1
          fi

          xcodebuild -list -json -workspace "$workspace" > "$RUNNER_TEMP/xcode-list.json"
          scheme="$(ruby -rjson -e 'puts JSON.parse(File.read(ARGV[0])).dig("workspace", "schemes").first' "$RUNNER_TEMP/xcode-list.json")"
          bundle_id="$(node -e "const app=require('./app.json'); console.log(app.expo.ios.bundleIdentifier)")"

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>${{ inputs.export_method }}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>${IOS_TEAM_ID}</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${bundle_id}</key>
              <string>${IOS_PROFILE_NAME}</string>
            </dict>
          </dict>
          </plist>
          PLIST

          xcodebuild archive \
            -workspace "$workspace" \
            -scheme "$scheme" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/SISMU-Mobile.xcarchive" \
            DEVELOPMENT_TEAM="$IOS_TEAM_ID" \
            CODE_SIGN_STYLE=Manual

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/SISMU-Mobile.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/ios-export"

      - name: Upload IPA
        if: steps.signing.outputs.can_build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mobile-app-ios-ipa
          path: ${{ runner.temp }}/ios-export/*.ipa
          if-no-files-found: error
