limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth_per_ip:10m rate=20r/m;
limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.html index.php;
    resolver 127.0.0.11 valid=30s ipv6=off;

    server_tokens off;
    client_max_body_size 25m;
    limit_conn conn_per_ip 80;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        application/xml
        image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Resource-Policy same-site always;
    add_header X-Permitted-Cross-Domain-Policies none always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https: wss:; worker-src 'self' blob:" always;

    if ($request_method !~ ^(GET|POST|PUT|PATCH|DELETE|OPTIONS|HEAD)$) {
        return 405;
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location ~* \.(?:css|js|mjs|map|jpg|jpeg|gif|png|svg|ico|webp|avif|woff2?|ttf)$ {
        add_header Cache-Control "public, max-age=604800" always;
        access_log off;
        try_files $uri =404;
    }

    location /api/auth/ {
        limit_req zone=auth_per_ip burst=20 nodelay;
        try_files $uri /index.php?$query_string;
    }

    location /api/ {
        limit_req zone=api_per_ip burst=120 nodelay;
        try_files $uri /index.php?$query_string;
    }

    location /sanctum/ {
        limit_req zone=api_per_ip burst=120 nodelay;
        try_files $uri /index.php?$query_string;
    }

    location = /up {
        try_files $uri /index.php?$query_string;
    }

    location ~ \.php$ {
        set $php_upstream backend:9000;
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param HTTP_PROXY "";
        fastcgi_param REQUEST_ID $request_id;
        fastcgi_param HTTP_X_REQUEST_ID $request_id;
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
        fastcgi_param HTTP_X_FORWARDED_HOST $http_host;
        fastcgi_param HTTP_X_FORWARDED_PORT $server_port;
        fastcgi_pass $php_upstream;
        fastcgi_read_timeout 60s;
    }

    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~* \.(env|git|htaccess|htpasswd|ini|log|sql|bak|conf)$ {
        deny all;
    }
}
