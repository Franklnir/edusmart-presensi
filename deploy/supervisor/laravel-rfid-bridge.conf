[program:edusmart-rfid-bridge]
command=/usr/bin/php /var/www/edusmart/backend/artisan rfid:mqtt-bridge
process_name=%(program_name)s
directory=/var/www/edusmart/backend
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/supervisor/edusmart-rfid-bridge.log
stopwaitsecs=60
