# Override untuk target ujian/presensi besar pada VPS minimal 8 vCPU / 16 GB RAM.
# Pakai bersama docker-compose.prod.yml. Tetap wajib dibuktikan dengan load test.

services:
  postgres:
    command:
      - postgres
      - -c
      - max_connections=250
      - -c
      - shared_buffers=3GB
      - -c
      - effective_cache_size=9GB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=512MB
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - wal_buffers=32MB
    mem_limit: 4g
    cpus: "2.00"
    pids_limit: 512

  pgbouncer:
    volumes:
      - ./deploy/pgbouncer/pgbouncer.high-capacity.ini:/etc/pgbouncer/pgbouncer.ini:ro
    mem_limit: 512m
    cpus: "0.50"
    pids_limit: 256

  redis:
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --save
      - "60"
      - "1000"
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      - --maxmemory
      - ${REDIS_MAXMEMORY:-1536mb}
      - --maxmemory-policy
      - noeviction
    mem_limit: 2g
    cpus: "1.00"
    pids_limit: 256

  backend:
    environment:
      RFID_RATE_LIMIT_PER_MINUTE: ${RFID_RATE_LIMIT_PER_MINUTE:-3000}
      RFID_DEVICE_EVENT_LOG_ENABLED: ${RFID_DEVICE_EVENT_LOG_ENABLED:-false}
      RFID_MQTT_MODE_PUBLISH_AFTER_SCAN_THROTTLE_SECONDS: ${RFID_MQTT_MODE_PUBLISH_AFTER_SCAN_THROTTLE_SECONDS:-10}
      AUTH_RATE_LIMIT_PER_MINUTE: ${AUTH_RATE_LIMIT_PER_MINUTE:-30}
      AUTH_IP_RATE_LIMIT_PER_MINUTE: ${AUTH_IP_RATE_LIMIT_PER_MINUTE:-1200}
      AUTH_LOGIN_MAX_ATTEMPTS: ${AUTH_LOGIN_MAX_ATTEMPTS:-5}
      PHP_FPM_PM: dynamic
      PHP_FPM_PM_MAX_CHILDREN: ${PHP_FPM_PM_MAX_CHILDREN:-64}
      PHP_FPM_PM_START_SERVERS: ${PHP_FPM_PM_START_SERVERS:-12}
      PHP_FPM_PM_MIN_SPARE_SERVERS: ${PHP_FPM_PM_MIN_SPARE_SERVERS:-8}
      PHP_FPM_PM_MAX_SPARE_SERVERS: ${PHP_FPM_PM_MAX_SPARE_SERVERS:-24}
      PHP_FPM_PM_MAX_REQUESTS: ${PHP_FPM_PM_MAX_REQUESTS:-500}
    mem_limit: 4g
    cpus: "3.50"
    pids_limit: 1024

  worker:
    environment:
      QUEUE_WORKER_PROCESSES: ${QUEUE_WORKER_PROCESSES:-2}
      QUIZ_SCORING_WORKER_PROCESSES: ${QUIZ_SCORING_WORKER_PROCESSES:-8}
    mem_limit: 3g
    cpus: "3.00"
    pids_limit: 1024

  rfid_bridge:
    environment:
      RFID_DEVICE_EVENT_LOG_ENABLED: ${RFID_DEVICE_EVENT_LOG_ENABLED:-false}
      RFID_MQTT_MODE_PUBLISH_AFTER_SCAN_THROTTLE_SECONDS: ${RFID_MQTT_MODE_PUBLISH_AFTER_SCAN_THROTTLE_SECONDS:-10}
    mem_limit: 1g
    cpus: "1.00"
    pids_limit: 256

  scheduler:
    mem_limit: 512m
    cpus: "0.50"
    pids_limit: 192

  nginx:
    mem_limit: 512m
    cpus: "1.00"
    pids_limit: 512

  caddy:
    mem_limit: 512m
    cpus: "0.50"
    pids_limit: 256
