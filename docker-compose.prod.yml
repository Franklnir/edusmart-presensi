  rfid_bridge:
    image: ${EDUSMART_BACKEND_IMAGE:?EDUSMART_BACKEND_IMAGE is required. Build and push production images in GitHub Actions, then deploy with --pull-images.}
    container_name: edusmart-rfid-bridge
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      mosquitto:
        condition: service_started
    environment:
      APP_ROLE: rfid-bridge
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?APP_KEY is required}
      APP_URL: ${APP_URL:?APP_URL is required}
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL is required}
      LOG_CHANNEL: ${LOG_CHANNEL:-stderr}
      LOG_STACK: ${LOG_STACK:-stderr}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_DAILY_DAYS: ${LOG_DAILY_DAYS:-7}

      DB_CONNECTION: pgsql
      DB_HOST: pgbouncer
      DB_PORT: 6432
      DB_DATABASE: ${DB_DATABASE:?DB_DATABASE is required}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}

      CACHE_STORE: redis
      SESSION_DRIVER: redis
      SESSION_CONNECTION: default
      QUEUE_CONNECTION: redis

      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}

      SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS:?SANCTUM_STATEFUL_DOMAINS is required}
      SESSION_DOMAIN: ${SESSION_DOMAIN:-}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-*}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
      CORS_ALLOWED_ORIGIN_PATTERNS: ${CORS_ALLOWED_ORIGIN_PATTERNS:-}

      TENANT_ROOT_DOMAIN: ${TENANT_ROOT_DOMAIN:?TENANT_ROOT_DOMAIN is required}
      TENANT_DEFAULT_SLUG: ${TENANT_DEFAULT_SLUG:-default}
      TENANT_ADMIN_SUBDOMAIN: ${TENANT_ADMIN_SUBDOMAIN:-admin26}
      TENANT_ADMIN_HOSTS: ${TENANT_ADMIN_HOSTS:-}
      TENANT_ALLOW_ROOT_FOR_SUPER_ADMIN: ${TENANT_ALLOW_ROOT_FOR_SUPER_ADMIN:-false}
      TENANT_ALLOW_HEADER_OVERRIDE: ${TENANT_ALLOW_HEADER_OVERRIDE:-false}
      TENANT_PUBLIC_SCHEME: ${TENANT_PUBLIC_SCHEME:-https}
      TENANT_DNS_A_RECORD: ${TENANT_DNS_A_RECORD:-}
      TENANT_DNS_CNAME_TARGET: ${TENANT_DNS_CNAME_TARGET:-}
      TENANT_RESERVED: ${TENANT_RESERVED:-www,app,api,admin,admin26}
      TENANT_EDGE_PROXY_SECRET: ${TENANT_EDGE_PROXY_SECRET:-}
      TENANT_EDGE_ORIGIN_HOST: ${TENANT_EDGE_ORIGIN_HOST:-}
      SUPER_ADMIN_EMAILS: ${SUPER_ADMIN_EMAILS:?SUPER_ADMIN_EMAILS is required}
      SUPER_ADMIN_IDS: ${SUPER_ADMIN_IDS:-}
      SUPER_ADMIN_ALLOW_EMAIL_FALLBACK: ${SUPER_ADMIN_ALLOW_EMAIL_FALLBACK:-false}
      PASSWORD_MIN_LENGTH: ${PASSWORD_MIN_LENGTH:-12}

      RFID_SCAN_SHARED_KEY: ${RFID_SCAN_SHARED_KEY:?RFID_SCAN_SHARED_KEY is required}
      RFID_ALLOW_OPEN_HTTP: ${RFID_ALLOW_OPEN_HTTP:-false}
      RFID_TENANT_CACHE_TTL_SECONDS: ${RFID_TENANT_CACHE_TTL_SECONDS:-300}
      RFID_DEVICE_CACHE_TTL_SECONDS: ${RFID_DEVICE_CACHE_TTL_SECONDS:-60}
      RFID_DEVICE_AUTH_CACHE_TTL_SECONDS: ${RFID_DEVICE_AUTH_CACHE_TTL_SECONDS:-300}
      RFID_DEVICE_SEEN_THROTTLE_SECONDS: ${RFID_DEVICE_SEEN_THROTTLE_SECONDS:-30}
      RFID_ALWAYS_ACTIVE_CACHE_TTL_SECONDS: ${RFID_ALWAYS_ACTIVE_CACHE_TTL_SECONDS:-600}
      RFID_SYNC_BATCH_MAX_EVENTS: ${RFID_SYNC_BATCH_MAX_EVENTS:-500}
      RFID_MQTT_MODE_PUBLISH_AFTER_SCAN_THROTTLE_SECONDS: ${RFID_MQTT_MODE_PUBLISH_AFTER_SCAN_THROTTLE_SECONDS:-5}
      RFID_DEVICE_EVENT_LOG_ENABLED: ${RFID_DEVICE_EVENT_LOG_ENABLED:-true}
      RFID_DEVICE_EVENT_CACHE_TTL_SECONDS: ${RFID_DEVICE_EVENT_CACHE_TTL_SECONDS:-3600}
      RFID_MQTT_BRIDGE_ENABLED: ${RFID_MQTT_BRIDGE_ENABLED:-true}
      RFID_MQTT_HOST: ${RFID_MQTT_HOST:-}
      RFID_MQTT_PORT: ${RFID_MQTT_PORT:-8883}
      RFID_MQTT_USERNAME: ${RFID_MQTT_USERNAME:-}
      RFID_MQTT_PASSWORD: ${RFID_MQTT_PASSWORD:-}
      RFID_MQTT_CLIENT_ID_PREFIX: ${RFID_MQTT_CLIENT_ID_PREFIX:-edusmart-rfid-bridge}
      RFID_MQTT_QOS: ${RFID_MQTT_QOS:-1}
      RFID_MQTT_USE_TLS: ${RFID_MQTT_USE_TLS:-true}
      RFID_MQTT_TLS_VERIFY_PEER: ${RFID_MQTT_TLS_VERIFY_PEER:-true}
      RFID_MQTT_TLS_VERIFY_PEER_NAME: ${RFID_MQTT_TLS_VERIFY_PEER_NAME:-true}
      RFID_MQTT_TLS_ALLOW_SELF_SIGNED: ${RFID_MQTT_TLS_ALLOW_SELF_SIGNED:-false}
      RFID_MQTT_SCAN_TOPIC_TEMPLATE: ${RFID_MQTT_SCAN_TOPIC_TEMPLATE:-edusmart/{tenant}/rfid/scan}
      RFID_MQTT_SCAN_TOPIC_FILTER: ${RFID_MQTT_SCAN_TOPIC_FILTER:-}
      RFID_MQTT_RESPONSE_TOPIC_TEMPLATE: ${RFID_MQTT_RESPONSE_TOPIC_TEMPLATE:-edusmart/{tenant}/rfid/response}
      RFID_MQTT_MODE_TOPIC_TEMPLATE: ${RFID_MQTT_MODE_TOPIC_TEMPLATE:-edusmart/{tenant}/rfid/mode}
      RFID_MQTT_DEFAULT_TENANT_SLUG: ${RFID_MQTT_DEFAULT_TENANT_SLUG:-}
      RFID_MQTT_DEVICE_TENANT_MAP: ${RFID_MQTT_DEVICE_TENANT_MAP:-{}}
      RFID_MQTT_MODE_SYNC_INTERVAL: ${RFID_MQTT_MODE_SYNC_INTERVAL:-20}
      RFID_MQTT_RECONNECT_DELAY: ${RFID_MQTT_RECONNECT_DELAY:-5}
      RFID_MQTT_AUTO_RECONNECT_MAX_ATTEMPTS: ${RFID_MQTT_AUTO_RECONNECT_MAX_ATTEMPTS:-5}
      RFID_MQTT_AUTO_RECONNECT_DELAY_MS: ${RFID_MQTT_AUTO_RECONNECT_DELAY_MS:-500}
      RFID_MQTT_CONFIG_RELOAD_INTERVAL: ${RFID_MQTT_CONFIG_RELOAD_INTERVAL:-60}
      RFID_MQTT_MAX_PAYLOAD_BYTES: ${RFID_MQTT_MAX_PAYLOAD_BYTES:-8192}
      RFID_LIVE_EVENTS_REDIS_ENABLED: ${RFID_LIVE_EVENTS_REDIS_ENABLED:-true}
      RFID_LIVE_EVENTS_REDIS_CONNECTION: ${RFID_LIVE_EVENTS_REDIS_CONNECTION:-default}
      RFID_LIVE_EVENTS_STREAM_PREFIX: ${RFID_LIVE_EVENTS_STREAM_PREFIX:-rfid:live}
      RFID_LIVE_EVENTS_STREAM_MAX_LENGTH: ${RFID_LIVE_EVENTS_STREAM_MAX_LENGTH:-1000}
      RFID_LIVE_EVENTS_STREAM_TTL_SECONDS: ${RFID_LIVE_EVENTS_STREAM_TTL_SECONDS:-86400}
      RFID_MOSQUITTO_ENABLED: ${RFID_MOSQUITTO_ENABLED:-true}
      RFID_MOSQUITTO_PUBLIC_HOST: ${RFID_MOSQUITTO_PUBLIC_HOST:-}
      RFID_MOSQUITTO_PUBLIC_PORT: ${RFID_MOSQUITTO_PUBLIC_PORT:-8883}
      RFID_MOSQUITTO_PUBLIC_USE_TLS: ${RFID_MOSQUITTO_PUBLIC_USE_TLS:-true}
      RFID_MOSQUITTO_INTERNAL_HOST: ${RFID_MOSQUITTO_INTERNAL_HOST:-mosquitto}
      RFID_MOSQUITTO_INTERNAL_PORT: ${RFID_MOSQUITTO_INTERNAL_PORT:-1883}
      RFID_MOSQUITTO_INTERNAL_USE_TLS: ${RFID_MOSQUITTO_INTERNAL_USE_TLS:-false}
      RFID_MOSQUITTO_BRIDGE_USERNAME: ${RFID_MOSQUITTO_BRIDGE_USERNAME:-edusmart_bridge}
      RFID_MOSQUITTO_BRIDGE_PASSWORD: ${RFID_MOSQUITTO_BRIDGE_PASSWORD:-}
      RFID_MOSQUITTO_TENANT_USERNAME_PREFIX: ${RFID_MOSQUITTO_TENANT_USERNAME_PREFIX:-edusmart}
      RFID_MOSQUITTO_TOPIC_PREFIX: ${RFID_MOSQUITTO_TOPIC_PREFIX:-edusmart}
      RFID_MOSQUITTO_STRICT_DEVICE_ACL: ${RFID_MOSQUITTO_STRICT_DEVICE_ACL:-true}
      RFID_MOSQUITTO_PASSWD_BINARY: ${RFID_MOSQUITTO_PASSWD_BINARY:-mosquitto_passwd}
      RFID_MOSQUITTO_FILE_UID: ${RFID_MOSQUITTO_FILE_UID:-82}
      RFID_MOSQUITTO_FILE_GID: ${RFID_MOSQUITTO_FILE_GID:-82}
      RFID_MOSQUITTO_FILE_MODE: ${RFID_MOSQUITTO_FILE_MODE:-0660}
      RFID_MOSQUITTO_PASSWORD_FILE: ${RFID_MOSQUITTO_PASSWORD_FILE:-/var/www/html/mosquitto/passwords}
      RFID_MOSQUITTO_ACL_FILE: ${RFID_MOSQUITTO_ACL_FILE:-/var/www/html/mosquitto/aclfile}
    volumes:
      - backend_storage:/var/www/html/storage
      - backend_bootstrap_cache:/var/www/html/bootstrap/cache
      - ./deploy/mosquitto/generated:/var/www/html/mosquitto
    command:
      - sh
      - -lc
      - |
        if [ "${RFID_MQTT_BRIDGE_ENABLED:-true}" != "true" ]; then
          echo "RFID MQTT bridge disabled; container kept idle."
          trap : TERM INT
          sleep infinity & wait
        fi
        exec php artisan rfid:mqtt-bridge
    networks:
      - internal

  nginx:
    image: ${EDUSMART_NGINX_IMAGE:?EDUSMART_NGINX_IMAGE is required. Build and push production images in GitHub Actions, then deploy with --pull-images.}
    container_name: edusmart-nginx
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      backend:
        condition: service_healthy
    environment:
      TENANT_EDGE_PROXY_SECRET: ${TENANT_EDGE_PROXY_SECRET:?TENANT_EDGE_PROXY_SECRET is required}
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --header=\"X-Sismu-Edge-Secret: $${TENANT_EDGE_PROXY_SECRET}\" -O /dev/null http://127.0.0.1/api/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 10
    networks:
      - internal

  caddy:
    image: ${EDUSMART_CADDY_IMAGE:?EDUSMART_CADDY_IMAGE is required. Build and push production Caddy WAF image in GitHub Actions, then deploy with --pull-images.}
    container_name: edusmart-caddy
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      nginx:
        condition: service_healthy
    environment:
      CADDY_ACME_EMAIL: ${CADDY_ACME_EMAIL:-admin@example.com}
      CADDY_ASK_SECRET: ${CADDY_ASK_SECRET:-}
      CADDY_EVOLUTION_HOST: ${CADDY_EVOLUTION_HOST:-evolution.localhost.invalid}
      CADDY_APP_HOSTS: ${CADDY_APP_HOSTS:-sismu.biz.id}
      CADDY_ROOT_DOMAIN: ${CADDY_ROOT_DOMAIN:-sismu.biz.id}
      CADDY_HTTPS_PORT_SUFFIX: ${CADDY_HTTPS_PORT_SUFFIX:-}
      TENANT_EDGE_PROXY_SECRET: ${TENANT_EDGE_PROXY_SECRET:?TENANT_EDGE_PROXY_SECRET is required}
      RFID_MOSQUITTO_PUBLIC_HOST: ${RFID_MOSQUITTO_PUBLIC_HOST:-mqtt.sismu.biz.id}
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD-SHELL", "caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - internal

volumes:
  postgres_data:
  redis_data:
  pgbouncer_config:
  mosquitto_data:
  mosquitto_log:
  evolution_postgres_data:
  evolution_redis_data:
  evolution_instances:
  backend_storage:
  backend_bootstrap_cache:
  caddy_data:
  caddy_config:

networks:
  internal:
    driver: bridge
