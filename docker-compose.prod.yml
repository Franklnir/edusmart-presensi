name: edusmart-prod

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "5m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    container_name: edusmart-postgres
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: ${DB_DATABASE:?DB_DATABASE is required}
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - internal

  pgbouncer_init:
    image: postgres:16-alpine
    container_name: edusmart-pgbouncer-init
    restart: "no"
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_SOURCE_HOST: postgres
      DB_DATABASE: ${DB_DATABASE:?DB_DATABASE is required}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - ./deploy/pgbouncer/generate-userlist.sh:/generate-userlist.sh:ro
      - ./deploy/pgbouncer/pgbouncer.ini:/seed/pgbouncer.ini:ro
      - pgbouncer_config:/pgbouncer-config
    command: ["sh", "/generate-userlist.sh"]
    networks:
      - internal

  pgbouncer:
    image: edoburu/pgbouncer:v1.23.1-p3
    container_name: edusmart-pgbouncer
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer_init:
        condition: service_completed_successfully
    environment:
      DB_DATABASE: ${DB_DATABASE:?DB_DATABASE is required}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - pgbouncer_config:/etc/pgbouncer
    expose:
      - "6432"
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=\"$${DB_PASSWORD}\" psql -h 127.0.0.1 -p 6432 -U \"$${DB_USERNAME}\" -d \"$${DB_DATABASE}\" -Atqc 'select 1' | grep -qx 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - internal

  redis:
    image: redis:7-alpine
    container_name: edusmart-redis
    restart: unless-stopped
    logging: *default-logging
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --save
      - "60"
      - "1000"
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - internal

  mosquitto_init:
    image: alpine:3.20
    container_name: edusmart-mosquitto-init
    restart: "no"
    logging: *default-logging
    environment:
      RFID_MOSQUITTO_PUBLIC_HOST: ${RFID_MOSQUITTO_PUBLIC_HOST:-edusmart-mqtt.local}
    volumes:
      - ./deploy/mosquitto/generated:/generated
      - mosquitto_data:/mosquitto-data
      - mosquitto_log:/mosquitto-log
    command:
      - sh
      - -lc
      - |
        set -eu
        mkdir -p /generated/certs
        mkdir -p /mosquitto-data /mosquitto-log
        touch /generated/passwords /generated/aclfile
        chown -R 82:82 /generated /mosquitto-data /mosquitto-log
        chmod 0770 /generated
        chmod 0660 /generated/passwords /generated/aclfile
        if [ ! -s /generated/certs/server.key ] || [ ! -s /generated/certs/server.crt ]; then
          apk add --no-cache openssl >/dev/null
          openssl req -x509 -nodes -newkey rsa:2048 -sha256 -days 3650 \
            -keyout /generated/certs/server.key \
            -out /generated/certs/server.crt \
            -subj "/CN=${RFID_MOSQUITTO_PUBLIC_HOST:-edusmart-mqtt.local}"
        fi
        chown -R 82:82 /generated/certs
        chmod 0750 /generated/certs
        chmod 0640 /generated/certs/server.key /generated/certs/server.crt
    networks:
      - internal

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: edusmart-mosquitto
    restart: unless-stopped
    user: "82:82"
    logging: *default-logging
    depends_on:
      mosquitto_init:
        condition: service_completed_successfully
    volumes:
      - ./deploy/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./deploy/mosquitto/generated:/mosquitto/config/generated:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    expose:
      - "1883"
    ports:
      - "${RFID_MOSQUITTO_PUBLIC_PORT:-8883}:8883"
    networks:
      - internal

  mosquitto_reloader:
    image: alpine:3.20
    container_name: edusmart-mosquitto-reloader
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      mosquitto:
        condition: service_started
    pid: "service:mosquitto"
    volumes:
      - ./deploy/mosquitto/generated:/generated:ro
    command:
      - sh
      - -lc
      - |
        last=""
        while true; do
          current="$$(sha256sum /generated/passwords /generated/aclfile /generated/certs/server.crt /generated/certs/server.key 2>/dev/null | sha256sum | awk '{print $$1}')"
          if [ -n "$$last" ] && [ "$$current" != "$$last" ]; then
            kill -HUP 1 || true
          fi
          last="$$current"
          sleep 10
        done
    networks:
      - internal

  mosquitto_cert_sync:
    image: alpine:3.20
    container_name: edusmart-mosquitto-cert-sync
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      caddy:
        condition: service_started
      mosquitto_init:
        condition: service_completed_successfully
    environment:
      RFID_MOSQUITTO_PUBLIC_HOST: ${RFID_MOSQUITTO_PUBLIC_HOST:-mqtt.sismu.biz.id}
      MOSQUITTO_CERT_SYNC_INTERVAL_SECONDS: ${MOSQUITTO_CERT_SYNC_INTERVAL_SECONDS:-300}
    volumes:
      - caddy_data:/caddy-data:ro
      - ./deploy/mosquitto/generated:/generated
    command:
      - sh
      - -lc
      - |
        set -eu
        host="$${RFID_MOSQUITTO_PUBLIC_HOST:-mqtt.sismu.biz.id}"
        interval="$${MOSQUITTO_CERT_SYNC_INTERVAL_SECONDS:-300}"

        sync_once() {
          cert="$$(find /caddy-data/caddy/certificates -path "*/$${host}/$${host}.crt" -type f 2>/dev/null | sort | head -n 1 || true)"
          key="$$(find /caddy-data/caddy/certificates -path "*/$${host}/$${host}.key" -type f 2>/dev/null | sort | head -n 1 || true)"

          if [ -z "$$cert" ] || [ -z "$$key" ]; then
            echo "Waiting for Caddy certificate for $${host}"
            return 1
          fi

          mkdir -p /generated/certs
          updated=0
          if ! cmp -s "$$cert" /generated/certs/server.crt; then
            cp "$$cert" /generated/certs/server.crt
            updated=1
          fi
          if ! cmp -s "$$key" /generated/certs/server.key; then
            cp "$$key" /generated/certs/server.key
            updated=1
          fi

          chown -R 82:82 /generated/certs
          chmod 0750 /generated/certs
          chmod 0640 /generated/certs/server.crt /generated/certs/server.key

          if [ "$$updated" -eq 1 ]; then
            echo "Synced Caddy certificate for $${host} to Mosquitto"
          fi
        }

        while true; do
          sync_once || true
          sleep "$$interval"
        done
    networks:
      - internal

  evolution_postgres:
    image: postgres:16-alpine
    container_name: edusmart-evolution-postgres
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: ${EVOLUTION_DB_NAME:-evolution}
      POSTGRES_USER: ${EVOLUTION_DB_USER:-evolution}
      POSTGRES_PASSWORD: ${EVOLUTION_DB_PASSWORD:?EVOLUTION_DB_PASSWORD is required}
    volumes:
      - evolution_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${EVOLUTION_DB_USER:-evolution} -d ${EVOLUTION_DB_NAME:-evolution}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - internal

  evolution_redis:
    image: redis:7-alpine
    container_name: edusmart-evolution-redis
    restart: unless-stopped
    logging: *default-logging
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --save
      - "60"
      - "1000"
      - --requirepass
      - ${EVOLUTION_REDIS_PASSWORD:?EVOLUTION_REDIS_PASSWORD is required}
    volumes:
      - evolution_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${EVOLUTION_REDIS_PASSWORD} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - internal

  evolution_api:
    image: ${EVOLUTION_API_IMAGE:-evoapicloud/evolution-api:v2.3.7}
    container_name: edusmart-evolution-api
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      evolution_postgres:
        condition: service_healthy
      evolution_redis:
        condition: service_healthy
    environment:
      SERVER_TYPE: http
      SERVER_PORT: 8080
      SERVER_URL: ${EVOLUTION_PUBLIC_URL:?EVOLUTION_PUBLIC_URL is required}
      DOCKER_ENV: "true"
      AUTHENTICATION_TYPE: apikey
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:?EVOLUTION_API_KEY is required}
      LOG_LEVEL: ${EVOLUTION_LOG_LEVEL:-ERROR,WARN,INFO}
      DEL_INSTANCE: ${EVOLUTION_DEL_INSTANCE:-true}
      CONFIG_SESSION_PHONE_CLIENT: ${EVOLUTION_SESSION_PHONE_CLIENT:-EduSmart}
      CONFIG_SESSION_PHONE_NAME: ${EVOLUTION_SESSION_PHONE_NAME:-Chrome}
      QRCODE_LIMIT: ${EVOLUTION_QRCODE_LIMIT:-30}
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://${EVOLUTION_DB_USER:-evolution}:${EVOLUTION_DB_PASSWORD:?EVOLUTION_DB_PASSWORD is required}@evolution_postgres:5432/${EVOLUTION_DB_NAME:-evolution}?schema=public
      DATABASE_CONNECTION_CLIENT_NAME: ${EVOLUTION_DB_CLIENT_NAME:-edusmart_evolution}
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: ${EVOLUTION_SAVE_NEW_MESSAGE:-false}
      DATABASE_SAVE_MESSAGE_UPDATE: ${EVOLUTION_SAVE_MESSAGE_UPDATE:-false}
      DATABASE_SAVE_DATA_CONTACTS: "true"
      DATABASE_SAVE_DATA_CHATS: "true"
      DATABASE_SAVE_DATA_LABELS: "false"
      DATABASE_SAVE_DATA_HISTORIC: "false"
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://:${EVOLUTION_REDIS_PASSWORD:?EVOLUTION_REDIS_PASSWORD is required}@evolution_redis:6379/0
      CACHE_REDIS_PREFIX_KEY: ${EVOLUTION_REDIS_PREFIX_KEY:-edusmart-evolution}
      CACHE_REDIS_SAVE_INSTANCES: ${EVOLUTION_REDIS_SAVE_INSTANCES:-false}
      WEBSOCKET_ENABLED: "false"
      TELEMETRY: ${EVOLUTION_TELEMETRY:-false}
      CORS_ORIGIN: ${EVOLUTION_CORS_ORIGIN:?EVOLUTION_CORS_ORIGIN is required}
      CORS_METHODS: ${EVOLUTION_CORS_METHODS:-GET,POST,PUT,DELETE}
      CORS_CREDENTIALS: ${EVOLUTION_CORS_CREDENTIALS:-true}
    volumes:
      - evolution_instances:/evolution/instances
    expose:
      - "8080"
    networks:
      - internal

  backend:
    image: ${EDUSMART_BACKEND_IMAGE:?EDUSMART_BACKEND_IMAGE is required. Build and push production images in GitHub Actions, then deploy with --pull-images.}
    container_name: edusmart-backend
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ROLE: web
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?APP_KEY is required}
      APP_URL: ${APP_URL:?APP_URL is required}
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL is required}
      LOG_CHANNEL: ${LOG_CHANNEL:-stderr}
      LOG_STACK: ${LOG_STACK:-stderr}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_DAILY_DAYS: ${LOG_DAILY_DAYS:-7}
      PHP_FPM_PM: ${PHP_FPM_PM:-dynamic}
      PHP_FPM_PM_MAX_CHILDREN: ${PHP_FPM_PM_MAX_CHILDREN:-12}
      PHP_FPM_PM_START_SERVERS: ${PHP_FPM_PM_START_SERVERS:-3}
      PHP_FPM_PM_MIN_SPARE_SERVERS: ${PHP_FPM_PM_MIN_SPARE_SERVERS:-2}
      PHP_FPM_PM_MAX_SPARE_SERVERS: ${PHP_FPM_PM_MAX_SPARE_SERVERS:-5}
      PHP_FPM_PM_MAX_REQUESTS: ${PHP_FPM_PM_MAX_REQUESTS:-500}

      DB_CONNECTION: pgsql
      DB_HOST: pgbouncer
      DB_PORT: 6432
      DB_DATABASE: ${DB_DATABASE:?DB_DATABASE is required}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}

      CACHE_STORE: redis
      SESSION_DRIVER: redis
      SESSION_CONNECTION: default
      QUEUE_CONNECTION: redis
      REDIS_QUEUE_RETRY_AFTER: ${REDIS_QUEUE_RETRY_AFTER:-1200}
      HORIZON_NAME: ${HORIZON_NAME:-EduSmart Production Queue}
      HORIZON_PATH: ${HORIZON_PATH:-horizon}
      HORIZON_MEMORY_LIMIT_MB: ${HORIZON_MEMORY_LIMIT_MB:-128}
      HORIZON_MONITORED_QUEUES: ${HORIZON_MONITORED_QUEUES:-default,backup,quiz-scoring}
      QUIZ_CONTENT_CACHE_ENABLED: ${QUIZ_CONTENT_CACHE_ENABLED:-true}
      QUIZ_CONTENT_CACHE_TTL_SECONDS: ${QUIZ_CONTENT_CACHE_TTL_SECONDS:-300}
      QUIZ_ASYNC_SCORING_ENABLED: ${QUIZ_ASYNC_SCORING_ENABLED:-true}
      QUIZ_SCORING_QUEUE: ${QUIZ_SCORING_QUEUE:-quiz-scoring}
      QUIZ_WORKER_HEARTBEAT_MAX_AGE_SECONDS: ${QUIZ_WORKER_HEARTBEAT_MAX_AGE_SECONDS:-150}
      QUIZ_MONITOR_WARNING_QUEUE_SIZE: ${QUIZ_MONITOR_WARNING_QUEUE_SIZE:-100}
      QUIZ_MONITOR_CRITICAL_QUEUE_SIZE: ${QUIZ_MONITOR_CRITICAL_QUEUE_SIZE:-500}
      QUEUE_WORKER_TIMEOUT_SECONDS: ${QUEUE_WORKER_TIMEOUT_SECONDS:-900}
      BACKUP_QUEUE: ${BACKUP_QUEUE:-backup}
      BACKUP_JOB_STATUS_TTL_HOURS: ${BACKUP_JOB_STATUS_TTL_HOURS:-24}
      BACKUP_JOB_TIMEOUT_SECONDS: ${BACKUP_JOB_TIMEOUT_SECONDS:-900}
      BACKUP_MONTHLY_STATUS_CACHE_TTL_SECONDS: ${BACKUP_MONTHLY_STATUS_CACHE_TTL_SECONDS:-60}
      BACKUP_MONTHLY_AUTO_START_TIME: ${BACKUP_MONTHLY_AUTO_START_TIME:-23:15}
      BACKUP_MONTHLY_AUTO_TENANT_SPACING_MINUTES: ${BACKUP_MONTHLY_AUTO_TENANT_SPACING_MINUTES:-4}
      BACKUP_MONTHLY_ACTIVE_JOB_LOCK_MINUTES: ${BACKUP_MONTHLY_ACTIVE_JOB_LOCK_MINUTES:-45}

      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}

      SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-true}
      SESSION_HTTP_ONLY: ${SESSION_HTTP_ONLY:-true}
      SESSION_SAME_SITE: ${SESSION_SAME_SITE:-lax}
      SESSION_DOMAIN: ${SESSION_DOMAIN:-}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-*}
      SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS:?SANCTUM_STATEFUL_DOMAINS is required}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
      CORS_ALLOWED_ORIGIN_PATTERNS: ${CORS_ALLOWED_ORIGIN_PATTERNS:-}
      API_RATE_LIMIT_PER_MINUTE: ${API_RATE_LIMIT_PER_MINUTE:-300}
      PUBLIC_DIRECTORY_RATE_LIMIT_PER_MINUTE: ${PUBLIC_DIRECTORY_RATE_LIMIT_PER_MINUTE:-60}
      DB_RATE_LIMIT_PER_MINUTE: ${DB_RATE_LIMIT_PER_MINUTE:-300}
      DB_GUEST_RATE_LIMIT_PER_MINUTE: ${DB_GUEST_RATE_LIMIT_PER_MINUTE:-360}
      DB_DEFAULT_SELECT_LIMIT: ${DB_DEFAULT_SELECT_LIMIT:-250}
      DB_ROSTER_SELECT_LIMIT: ${DB_ROSTER_SELECT_LIMIT:-2000}
      DB_MAX_SELECT_LIMIT: ${DB_MAX_SELECT_LIMIT:-2000}
      DB_MAX_SELECT_LIMIT_ADMIN: ${DB_MAX_SELECT_LIMIT_ADMIN:-5000}
      DB_MAX_OFFSET: ${DB_MAX_OFFSET:-25000}
      DB_BATCH_MAX_ITEMS: ${DB_BATCH_MAX_ITEMS:-12}
      DB_BATCH_MAX_TOTAL_ROWS: ${DB_BATCH_MAX_TOTAL_ROWS:-5000}
      DB_GATEWAY_TIME_LIMIT_SECONDS: ${DB_GATEWAY_TIME_LIMIT_SECONDS:-60}
      RFID_RATE_LIMIT_PER_MINUTE: ${RFID_RATE_LIMIT_PER_MINUTE:-1200}
      RFID_TENANT_CACHE_TTL_SECONDS: ${RFID_TENANT_CACHE_TTL_SECONDS:-300}
      RFID_DEVICE_CACHE_TTL_SECONDS: ${RFID_DEVICE_CACHE_TTL_SECONDS:-60}
      RFID_DEVICE_AUTH_CACHE_TTL_SECONDS: ${RFID_DEVICE_AUTH_CACHE_TTL_SECONDS:-300}
      RFID_DEVICE_SEEN_THROTTLE_SECONDS: ${RFID_DEVICE_SEEN_THROTTLE_SECONDS:-30}
      RFID_ALWAYS_ACTIVE_CACHE_TTL_SECONDS: ${RFID_ALWAYS_ACTIVE_CACHE_TTL_SECONDS:-600}
      RFID_SYNC_BATCH_MAX_EVENTS: ${RFID_SYNC_BATCH_MAX_EVENTS:-500}
      RFID_MQTT_MODE_PUBLISH_AFTER_SCAN_THROTTLE_SECONDS: ${RFID_MQTT_MODE_PUBLISH_AFTER_SCAN_THROTTLE_SECONDS:-5}
      RFID_DEVICE_EVENT_LOG_ENABLED: ${RFID_DEVICE_EVENT_LOG_ENABLED:-true}
      RFID_DEVICE_EVENT_CACHE_TTL_SECONDS: ${RFID_DEVICE_EVENT_CACHE_TTL_SECONDS:-3600}
      RFID_LIVE_EVENTS_REDIS_ENABLED: ${RFID_LIVE_EVENTS_REDIS_ENABLED:-true}
      RFID_LIVE_EVENTS_REDIS_CONNECTION: ${RFID_LIVE_EVENTS_REDIS_CONNECTION:-default}
      RFID_LIVE_EVENTS_STREAM_PREFIX: ${RFID_LIVE_EVENTS_STREAM_PREFIX:-rfid:live}
      RFID_LIVE_EVENTS_STREAM_MAX_LENGTH: ${RFID_LIVE_EVENTS_STREAM_MAX_LENGTH:-1000}
      RFID_LIVE_EVENTS_STREAM_TTL_SECONDS: ${RFID_LIVE_EVENTS_STREAM_TTL_SECONDS:-86400}
      RFID_LIVE_EVENTS_READ_BLOCK_MS: ${RFID_LIVE_EVENTS_READ_BLOCK_MS:-1000}
      RFID_LIVE_EVENTS_DB_CATCHUP_SECONDS: ${RFID_LIVE_EVENTS_DB_CATCHUP_SECONDS:-5}
      WEBHOOK_RATE_LIMIT_PER_MINUTE: ${WEBHOOK_RATE_LIMIT_PER_MINUTE:-60}
      STORAGE_WRITE_RATE_LIMIT_PER_MINUTE: ${STORAGE_WRITE_RATE_LIMIT_PER_MINUTE:-90}
      STORAGE_READ_RATE_LIMIT_PER_MINUTE: ${STORAGE_READ_RATE_LIMIT_PER_MINUTE:-180}
      STORAGE_GUEST_RATE_LIMIT_PER_MINUTE: ${STORAGE_GUEST_RATE_LIMIT_PER_MINUTE:-60}

      TENANT_ROOT_DOMAIN: ${TENANT_ROOT_DOMAIN:?TENANT_ROOT_DOMAIN is required}
      TENANT_DEFAULT_SLUG: ${TENANT_DEFAULT_SLUG:-default}
      TENANT_ADMIN_SUBDOMAIN: ${TENANT_ADMIN_SUBDOMAIN:-admin26}
      TENANT_ADMIN_HOSTS: ${TENANT_ADMIN_HOSTS:-}
      TENANT_ALLOW_ROOT_FOR_SUPER_ADMIN: ${TENANT_ALLOW_ROOT_FOR_SUPER_ADMIN:-false}
      TENANT_ALLOW_HEADER_OVERRIDE: ${TENANT_ALLOW_HEADER_OVERRIDE:-false}
      TENANT_PUBLIC_SCHEME: ${TENANT_PUBLIC_SCHEME:-https}
      TENANT_DNS_A_RECORD: ${TENANT_DNS_A_RECORD:-}
      TENANT_DNS_CNAME_TARGET: ${TENANT_DNS_CNAME_TARGET:-}
      TENANT_RESERVED: ${TENANT_RESERVED:-www,app,api,admin,admin26}
      TENANT_EDGE_PROXY_SECRET: ${TENANT_EDGE_PROXY_SECRET:-}
      TENANT_REQUIRE_EDGE_PROXY: ${TENANT_REQUIRE_EDGE_PROXY:-true}
      TENANT_EDGE_ORIGIN_HOST: ${TENANT_EDGE_ORIGIN_HOST:-}

      SUPER_ADMIN_EMAILS: ${SUPER_ADMIN_EMAILS:?SUPER_ADMIN_EMAILS is required}
      SUPER_ADMIN_IDS: ${SUPER_ADMIN_IDS:-}
      SUPER_ADMIN_ALLOW_EMAIL_FALLBACK: ${SUPER_ADMIN_ALLOW_EMAIL_FALLBACK:-false}
      SUPER_ADMIN_BOOTSTRAP_EMAIL: ${SUPER_ADMIN_BOOTSTRAP_EMAIL:-}
      SUPER_ADMIN_BOOTSTRAP_PASSWORD: ${SUPER_ADMIN_BOOTSTRAP_PASSWORD:-}
      SUPER_ADMIN_BOOTSTRAP_NAME: ${SUPER_ADMIN_BOOTSTRAP_NAME:-Super Admin}
      SUPER_ADMIN_BOOTSTRAP_TENANT_SLUG: ${SUPER_ADMIN_BOOTSTRAP_TENANT_SLUG:-}
      SUPER_ADMIN_BOOTSTRAP_ID: ${SUPER_ADMIN_BOOTSTRAP_ID:-}
      SUPER_ADMIN_BOOTSTRAP_FORCE: ${SUPER_ADMIN_BOOTSTRAP_FORCE:-false}
      PASSWORD_MIN_LENGTH: ${PASSWORD_MIN_LENGTH:-12}

      FILESYSTEM_DISK: local
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      WAIT_FOR_DB: "true"
      AUTH_RATE_LIMIT_PER_MINUTE: ${AUTH_RATE_LIMIT_PER_MINUTE:-20}
      AUTH_IP_RATE_LIMIT_PER_MINUTE: ${AUTH_IP_RATE_LIMIT_PER_MINUTE:-600}
      AUTH_LOGIN_MAX_ATTEMPTS: ${AUTH_LOGIN_MAX_ATTEMPTS:-5}
      SECURITY_SCANNER_BLOCK_ENABLED: ${SECURITY_SCANNER_BLOCK_ENABLED:-true}
      SECURITY_SCANNER_BLOCK_AUDIT: ${SECURITY_SCANNER_BLOCK_AUDIT:-true}
      SECURITY_BLOCKED_IPS: ${SECURITY_BLOCKED_IPS:-}
      SECURITY_BLOCKED_USER_AGENTS: ${SECURITY_BLOCKED_USER_AGENTS:-sqlmap,nikto,acunetix,nessus,nuclei,zgrab,masscan,dirbuster,gobuster,ffuf,wpscan}
      MAIL_MAILER: ${MAIL_MAILER:-smtp}
      MAIL_SCHEME: ${MAIL_SCHEME:-smtp}
      MAIL_HOST: ${MAIL_HOST:-smtp-relay.brevo.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-no-reply@example.com}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-EduSmart}
      GOOGLE_AUTH_ENABLED: ${GOOGLE_AUTH_ENABLED:-false}
