name: edusmart-prod

services:
  postgres:
    image: postgres:16-alpine
    container_name: edusmart-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:?DB_DATABASE is required}
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - internal

  redis:
    image: redis:7-alpine
    container_name: edusmart-redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --save
      - "60"
      - "1000"
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - internal

  backend:
    build:
      context: .
      dockerfile: backend/docker/Dockerfile.prod
    container_name: edusmart-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ROLE: web
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?APP_KEY is required}
      APP_URL: ${APP_URL:?APP_URL is required}
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL is required}
      LOG_CHANNEL: stack
      LOG_STACK: single
      LOG_LEVEL: info

      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:?DB_DATABASE is required}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}

      CACHE_STORE: redis
      SESSION_DRIVER: redis
      SESSION_CONNECTION: default
      QUEUE_CONNECTION: redis

      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}

      SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-true}
      SESSION_HTTP_ONLY: ${SESSION_HTTP_ONLY:-true}
      SESSION_SAME_SITE: ${SESSION_SAME_SITE:-lax}
      SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS:?SANCTUM_STATEFUL_DOMAINS is required}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
      CORS_ALLOWED_ORIGIN_PATTERNS: ${CORS_ALLOWED_ORIGIN_PATTERNS:-}
      DB_RATE_LIMIT_PER_MINUTE: ${DB_RATE_LIMIT_PER_MINUTE:-300}
      DB_GUEST_RATE_LIMIT_PER_MINUTE: ${DB_GUEST_RATE_LIMIT_PER_MINUTE:-360}

      TENANT_ROOT_DOMAIN: ${TENANT_ROOT_DOMAIN:?TENANT_ROOT_DOMAIN is required}
      TENANT_DEFAULT_SLUG: ${TENANT_DEFAULT_SLUG:-default}
      TENANT_ADMIN_SUBDOMAIN: ${TENANT_ADMIN_SUBDOMAIN:-admin}
      TENANT_ADMIN_HOSTS: ${TENANT_ADMIN_HOSTS:-}
      TENANT_ALLOW_ROOT_FOR_SUPER_ADMIN: ${TENANT_ALLOW_ROOT_FOR_SUPER_ADMIN:-false}
      TENANT_RESERVED: ${TENANT_RESERVED:-www,app,api,admin}

      SUPER_ADMIN_EMAILS: ${SUPER_ADMIN_EMAILS:?SUPER_ADMIN_EMAILS is required}
      SUPER_ADMIN_IDS: ${SUPER_ADMIN_IDS:-}

      FILESYSTEM_DISK: local
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-false}
      WAIT_FOR_DB: "true"
      AUTH_RATE_LIMIT_PER_MINUTE: ${AUTH_RATE_LIMIT_PER_MINUTE:-12}
      AUTH_IP_RATE_LIMIT_PER_MINUTE: ${AUTH_IP_RATE_LIMIT_PER_MINUTE:-90}
      AUTH_LOGIN_MAX_ATTEMPTS: ${AUTH_LOGIN_MAX_ATTEMPTS:-5}
      MAIL_MAILER: ${MAIL_MAILER:-smtp}
      MAIL_SCHEME: ${MAIL_SCHEME:-smtp}
      MAIL_HOST: ${MAIL_HOST:-smtp-relay.brevo.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-no-reply@example.com}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-EduSmart}
    volumes:
      - backend_storage:/var/www/html/storage
      - backend_bootstrap_cache:/var/www/html/bootstrap/cache
    expose:
      - "9000"
    networks:
      - internal

  backend_nginx:
    image: nginx:1.27-alpine
    container_name: edusmart-backend-nginx
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    volumes:
      - ./deploy/nginx/backend.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend/public:/var/www/html/public:ro
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/api/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 10
    networks:
      - internal

  worker:
    build:
      context: .
      dockerfile: backend/docker/Dockerfile.prod
    container_name: edusmart-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ROLE: worker
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?APP_KEY is required}
      APP_URL: ${APP_URL:?APP_URL is required}

      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:?DB_DATABASE is required}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}

      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis

      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}

      SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS:?SANCTUM_STATEFUL_DOMAINS is required}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
      CORS_ALLOWED_ORIGIN_PATTERNS: ${CORS_ALLOWED_ORIGIN_PATTERNS:-}
      TENANT_ROOT_DOMAIN: ${TENANT_ROOT_DOMAIN:?TENANT_ROOT_DOMAIN is required}
      TENANT_ADMIN_SUBDOMAIN: ${TENANT_ADMIN_SUBDOMAIN:-admin}
      TENANT_ADMIN_HOSTS: ${TENANT_ADMIN_HOSTS:-}
      TENANT_ALLOW_ROOT_FOR_SUPER_ADMIN: ${TENANT_ALLOW_ROOT_FOR_SUPER_ADMIN:-false}
      SUPER_ADMIN_EMAILS: ${SUPER_ADMIN_EMAILS:?SUPER_ADMIN_EMAILS is required}
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL is required}
      MAIL_MAILER: ${MAIL_MAILER:-smtp}
      MAIL_SCHEME: ${MAIL_SCHEME:-smtp}
      MAIL_HOST: ${MAIL_HOST:-smtp-relay.brevo.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-no-reply@example.com}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-EduSmart}
    volumes:
      - backend_storage:/var/www/html/storage
      - backend_bootstrap_cache:/var/www/html/bootstrap/cache
    command: ["php", "artisan", "queue:work", "redis", "--sleep=1", "--tries=3", "--timeout=120", "--max-time=3600"]
    networks:
      - internal

  scheduler:
    build:
      context: .
      dockerfile: backend/docker/Dockerfile.prod
    container_name: edusmart-scheduler
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ROLE: scheduler
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?APP_KEY is required}
      APP_URL: ${APP_URL:?APP_URL is required}

      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:?DB_DATABASE is required}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}

      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis

      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}

      SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS:?SANCTUM_STATEFUL_DOMAINS is required}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
      CORS_ALLOWED_ORIGIN_PATTERNS: ${CORS_ALLOWED_ORIGIN_PATTERNS:-}
      TENANT_ROOT_DOMAIN: ${TENANT_ROOT_DOMAIN:?TENANT_ROOT_DOMAIN is required}
      TENANT_ADMIN_SUBDOMAIN: ${TENANT_ADMIN_SUBDOMAIN:-admin}
      TENANT_ADMIN_HOSTS: ${TENANT_ADMIN_HOSTS:-}
      TENANT_ALLOW_ROOT_FOR_SUPER_ADMIN: ${TENANT_ALLOW_ROOT_FOR_SUPER_ADMIN:-false}
      SUPER_ADMIN_EMAILS: ${SUPER_ADMIN_EMAILS:?SUPER_ADMIN_EMAILS is required}
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL is required}
      MAIL_MAILER: ${MAIL_MAILER:-smtp}
      MAIL_SCHEME: ${MAIL_SCHEME:-smtp}
      MAIL_HOST: ${MAIL_HOST:-smtp-relay.brevo.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-no-reply@example.com}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-EduSmart}
    volumes:
      - backend_storage:/var/www/html/storage
      - backend_bootstrap_cache:/var/www/html/bootstrap/cache
    command: ["sh", "-lc", "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"]
    networks:
      - internal

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend.prod
      args:
        VITE_API_URL: ${VITE_API_URL:?VITE_API_URL is required}
        VITE_TENANT_SLUG: ${VITE_TENANT_SLUG:-}
        VITE_ROOT_DOMAIN: ${VITE_ROOT_DOMAIN:-}
        VITE_ADMIN_SUBDOMAIN: ${VITE_ADMIN_SUBDOMAIN:-admin}
        VITE_REALTIME_POLL_MS: ${VITE_REALTIME_POLL_MS:-4000}
        VITE_REALTIME_POLL_HIDDEN_MS: ${VITE_REALTIME_POLL_HIDDEN_MS:-12000}
    container_name: edusmart-frontend
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - internal

  nginx:
    image: nginx:1.27-alpine
    container_name: edusmart-nginx
    restart: unless-stopped
    depends_on:
      backend_nginx:
        condition: service_healthy
      frontend:
        condition: service_started
    volumes:
      - ./deploy/nginx/gateway.prod.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
    networks:
      - internal

volumes:
  postgres_data:
  backend_storage:
  backend_bootstrap_cache:

networks:
  internal:
    driver: bridge
