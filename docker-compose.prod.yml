name: edusmart-prod

services:
  postgres:
    image: postgres:16-alpine
    container_name: edusmart-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:?DB_DATABASE is required}
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - internal

  redis:
    image: redis:7-alpine
    container_name: edusmart-redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --save
      - "60"
      - "1000"
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - internal

  evolution_postgres:
    image: postgres:16-alpine
    container_name: edusmart-evolution-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${EVOLUTION_DB_NAME:-evolution}
      POSTGRES_USER: ${EVOLUTION_DB_USER:-evolution}
      POSTGRES_PASSWORD: ${EVOLUTION_DB_PASSWORD:?EVOLUTION_DB_PASSWORD is required}
    volumes:
      - evolution_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${EVOLUTION_DB_USER:-evolution} -d ${EVOLUTION_DB_NAME:-evolution}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - internal

  evolution_redis:
    image: redis:7-alpine
    container_name: edusmart-evolution-redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --save
      - "60"
      - "1000"
      - --requirepass
      - ${EVOLUTION_REDIS_PASSWORD:?EVOLUTION_REDIS_PASSWORD is required}
    volumes:
      - evolution_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${EVOLUTION_REDIS_PASSWORD} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - internal

  evolution_api:
    image: ${EVOLUTION_API_IMAGE:-atendai/evolution-api:v2.1.1}
    container_name: edusmart-evolution-api
    restart: unless-stopped
    depends_on:
      evolution_postgres:
        condition: service_healthy
      evolution_redis:
        condition: service_healthy
    environment:
      SERVER_TYPE: http
      SERVER_PORT: 8080
      SERVER_URL: ${EVOLUTION_PUBLIC_URL:?EVOLUTION_PUBLIC_URL is required}
      AUTHENTICATION_TYPE: apikey
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:?EVOLUTION_API_KEY is required}
      LOG_LEVEL: ${EVOLUTION_LOG_LEVEL:-ERROR,WARN,INFO}
      DEL_INSTANCE: false
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://${EVOLUTION_DB_USER:-evolution}:${EVOLUTION_DB_PASSWORD:?EVOLUTION_DB_PASSWORD is required}@evolution_postgres:5432/${EVOLUTION_DB_NAME:-evolution}?schema=public
      DATABASE_CONNECTION_CLIENT_NAME: ${EVOLUTION_DB_CLIENT_NAME:-edusmart_evolution}
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: ${EVOLUTION_SAVE_NEW_MESSAGE:-false}
      DATABASE_SAVE_MESSAGE_UPDATE: ${EVOLUTION_SAVE_MESSAGE_UPDATE:-false}
      DATABASE_SAVE_DATA_CONTACTS: "true"
      DATABASE_SAVE_DATA_CHATS: "true"
      DATABASE_SAVE_DATA_LABELS: "false"
      DATABASE_SAVE_DATA_HISTORIC: "false"
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://:${EVOLUTION_REDIS_PASSWORD:?EVOLUTION_REDIS_PASSWORD is required}@evolution_redis:6379/0
      WEBSOCKET_ENABLED: "false"
      TELEMETRY: ${EVOLUTION_TELEMETRY:-false}
      CORS_ORIGIN: ${EVOLUTION_CORS_ORIGIN:-*}
    volumes:
      - evolution_instances:/evolution/instances
    expose:
      - "8080"
    networks:
      - internal

  backend:
    build:
      context: .
      dockerfile: backend/docker/Dockerfile.prod
    container_name: edusmart-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ROLE: web
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?APP_KEY is required}
      APP_URL: ${APP_URL:?APP_URL is required}
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL is required}
      LOG_CHANNEL: stack
      LOG_STACK: single
      LOG_LEVEL: info

      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:?DB_DATABASE is required}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}

      CACHE_STORE: redis
      SESSION_DRIVER: redis
      SESSION_CONNECTION: default
      QUEUE_CONNECTION: redis

      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}

      SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-true}
      SESSION_HTTP_ONLY: ${SESSION_HTTP_ONLY:-true}
      SESSION_SAME_SITE: ${SESSION_SAME_SITE:-lax}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-*}
      SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS:?SANCTUM_STATEFUL_DOMAINS is required}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
      CORS_ALLOWED_ORIGIN_PATTERNS: ${CORS_ALLOWED_ORIGIN_PATTERNS:-}
      DB_RATE_LIMIT_PER_MINUTE: ${DB_RATE_LIMIT_PER_MINUTE:-300}
      DB_GUEST_RATE_LIMIT_PER_MINUTE: ${DB_GUEST_RATE_LIMIT_PER_MINUTE:-360}
      STORAGE_WRITE_RATE_LIMIT_PER_MINUTE: ${STORAGE_WRITE_RATE_LIMIT_PER_MINUTE:-90}
      STORAGE_READ_RATE_LIMIT_PER_MINUTE: ${STORAGE_READ_RATE_LIMIT_PER_MINUTE:-180}
      STORAGE_GUEST_RATE_LIMIT_PER_MINUTE: ${STORAGE_GUEST_RATE_LIMIT_PER_MINUTE:-60}

      TENANT_ROOT_DOMAIN: ${TENANT_ROOT_DOMAIN:?TENANT_ROOT_DOMAIN is required}
      TENANT_DEFAULT_SLUG: ${TENANT_DEFAULT_SLUG:-default}
      TENANT_ADMIN_SUBDOMAIN: ${TENANT_ADMIN_SUBDOMAIN:-admin}
      TENANT_ADMIN_HOSTS: ${TENANT_ADMIN_HOSTS:-}
      TENANT_ALLOW_ROOT_FOR_SUPER_ADMIN: ${TENANT_ALLOW_ROOT_FOR_SUPER_ADMIN:-false}
      TENANT_ALLOW_HEADER_OVERRIDE: ${TENANT_ALLOW_HEADER_OVERRIDE:-false}
      TENANT_RESERVED: ${TENANT_RESERVED:-www,app,api,admin}

      SUPER_ADMIN_EMAILS: ${SUPER_ADMIN_EMAILS:?SUPER_ADMIN_EMAILS is required}
      SUPER_ADMIN_IDS: ${SUPER_ADMIN_IDS:-}

      FILESYSTEM_DISK: local
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      WAIT_FOR_DB: "true"
      AUTH_RATE_LIMIT_PER_MINUTE: ${AUTH_RATE_LIMIT_PER_MINUTE:-12}
      AUTH_IP_RATE_LIMIT_PER_MINUTE: ${AUTH_IP_RATE_LIMIT_PER_MINUTE:-90}
      AUTH_LOGIN_MAX_ATTEMPTS: ${AUTH_LOGIN_MAX_ATTEMPTS:-5}
      MAIL_MAILER: ${MAIL_MAILER:-smtp}
      MAIL_SCHEME: ${MAIL_SCHEME:-smtp}
      MAIL_HOST: ${MAIL_HOST:-smtp-relay.brevo.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-no-reply@example.com}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-EduSmart}
      GOOGLE_AUTH_ENABLED: ${GOOGLE_AUTH_ENABLED:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      GOOGLE_AUTH_PROMPT: ${GOOGLE_AUTH_PROMPT:-select_account}
      EVOLUTION_API_BASE_URL: ${EVOLUTION_API_BASE_URL:-http://evolution_api:8080}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-}
      EVOLUTION_API_INTEGRATION: ${EVOLUTION_API_INTEGRATION:-WHATSAPP-BAILEYS}
      EVOLUTION_API_INSTANCE_PREFIX: ${EVOLUTION_API_INSTANCE_PREFIX:-edusmart}
      EVOLUTION_API_TIMEOUT_SECONDS: ${EVOLUTION_API_TIMEOUT_SECONDS:-20}
      EVOLUTION_API_VERIFY_SSL: ${EVOLUTION_API_VERIFY_SSL:-true}
      RFID_SCAN_SHARED_KEY: ${RFID_SCAN_SHARED_KEY:-}
      RFID_MQTT_BRIDGE_ENABLED: ${RFID_MQTT_BRIDGE_ENABLED:-false}
      RFID_MQTT_HOST: ${RFID_MQTT_HOST:-}
      RFID_MQTT_PORT: ${RFID_MQTT_PORT:-8883}
      RFID_MQTT_USERNAME: ${RFID_MQTT_USERNAME:-}
      RFID_MQTT_PASSWORD: ${RFID_MQTT_PASSWORD:-}
      RFID_MQTT_CLIENT_ID_PREFIX: ${RFID_MQTT_CLIENT_ID_PREFIX:-edusmart-rfid-bridge}
      RFID_MQTT_QOS: ${RFID_MQTT_QOS:-1}
      RFID_MQTT_USE_TLS: ${RFID_MQTT_USE_TLS:-true}
      RFID_MQTT_TLS_VERIFY_PEER: ${RFID_MQTT_TLS_VERIFY_PEER:-true}
      RFID_MQTT_TLS_VERIFY_PEER_NAME: ${RFID_MQTT_TLS_VERIFY_PEER_NAME:-true}
      RFID_MQTT_TLS_ALLOW_SELF_SIGNED: ${RFID_MQTT_TLS_ALLOW_SELF_SIGNED:-false}
      RFID_MQTT_SCAN_TOPIC_TEMPLATE: ${RFID_MQTT_SCAN_TOPIC_TEMPLATE:-edusmart/{tenant}/rfid/scan}
      RFID_MQTT_SCAN_TOPIC_FILTER: ${RFID_MQTT_SCAN_TOPIC_FILTER:-}
      RFID_MQTT_RESPONSE_TOPIC_TEMPLATE: ${RFID_MQTT_RESPONSE_TOPIC_TEMPLATE:-edusmart/{tenant}/rfid/response}
      RFID_MQTT_MODE_TOPIC_TEMPLATE: ${RFID_MQTT_MODE_TOPIC_TEMPLATE:-edusmart/{tenant}/rfid/mode}
      RFID_MQTT_DEFAULT_TENANT_SLUG: ${RFID_MQTT_DEFAULT_TENANT_SLUG:-}
      RFID_MQTT_DEVICE_TENANT_MAP: ${RFID_MQTT_DEVICE_TENANT_MAP:-{}}
      RFID_MQTT_MODE_SYNC_INTERVAL: ${RFID_MQTT_MODE_SYNC_INTERVAL:-20}
      RFID_MQTT_RECONNECT_DELAY: ${RFID_MQTT_RECONNECT_DELAY:-5}
      CADDY_ASK_SECRET: ${CADDY_ASK_SECRET:-}
      CADDY_EVOLUTION_HOST: ${CADDY_EVOLUTION_HOST:-evolution.localhost.invalid}
    volumes:
      - backend_storage:/var/www/html/storage
      - backend_bootstrap_cache:/var/www/html/bootstrap/cache
    expose:
      - "9000"
    networks:
      - internal

  worker:
    build:
      context: .
      dockerfile: backend/docker/Dockerfile.prod
    container_name: edusmart-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ROLE: worker
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?APP_KEY is required}
      APP_URL: ${APP_URL:?APP_URL is required}

      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:?DB_DATABASE is required}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}

      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis

      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}

      SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS:?SANCTUM_STATEFUL_DOMAINS is required}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-*}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
      CORS_ALLOWED_ORIGIN_PATTERNS: ${CORS_ALLOWED_ORIGIN_PATTERNS:-}
      TENANT_ROOT_DOMAIN: ${TENANT_ROOT_DOMAIN:?TENANT_ROOT_DOMAIN is required}
      TENANT_ADMIN_SUBDOMAIN: ${TENANT_ADMIN_SUBDOMAIN:-admin}
      TENANT_ADMIN_HOSTS: ${TENANT_ADMIN_HOSTS:-}
      TENANT_ALLOW_ROOT_FOR_SUPER_ADMIN: ${TENANT_ALLOW_ROOT_FOR_SUPER_ADMIN:-false}
      TENANT_ALLOW_HEADER_OVERRIDE: ${TENANT_ALLOW_HEADER_OVERRIDE:-false}
      SUPER_ADMIN_EMAILS: ${SUPER_ADMIN_EMAILS:?SUPER_ADMIN_EMAILS is required}
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL is required}
      MAIL_MAILER: ${MAIL_MAILER:-smtp}
      MAIL_SCHEME: ${MAIL_SCHEME:-smtp}
      MAIL_HOST: ${MAIL_HOST:-smtp-relay.brevo.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-no-reply@example.com}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-EduSmart}
      EVOLUTION_API_BASE_URL: ${EVOLUTION_API_BASE_URL:-http://evolution_api:8080}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-}
      EVOLUTION_API_INTEGRATION: ${EVOLUTION_API_INTEGRATION:-WHATSAPP-BAILEYS}
      EVOLUTION_API_INSTANCE_PREFIX: ${EVOLUTION_API_INSTANCE_PREFIX:-edusmart}
      EVOLUTION_API_TIMEOUT_SECONDS: ${EVOLUTION_API_TIMEOUT_SECONDS:-20}
      EVOLUTION_API_VERIFY_SSL: ${EVOLUTION_API_VERIFY_SSL:-true}
    volumes:
      - backend_storage:/var/www/html/storage
      - backend_bootstrap_cache:/var/www/html/bootstrap/cache
    command: ["php", "artisan", "queue:work", "redis", "--sleep=1", "--tries=3", "--timeout=120", "--max-time=3600"]
    networks:
      - internal

  scheduler:
    build:
      context: .
      dockerfile: backend/docker/Dockerfile.prod
    container_name: edusmart-scheduler
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ROLE: scheduler
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?APP_KEY is required}
      APP_URL: ${APP_URL:?APP_URL is required}

      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:?DB_DATABASE is required}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}

      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis

      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}

      SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS:?SANCTUM_STATEFUL_DOMAINS is required}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-*}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
      CORS_ALLOWED_ORIGIN_PATTERNS: ${CORS_ALLOWED_ORIGIN_PATTERNS:-}
      TENANT_ROOT_DOMAIN: ${TENANT_ROOT_DOMAIN:?TENANT_ROOT_DOMAIN is required}
      TENANT_ADMIN_SUBDOMAIN: ${TENANT_ADMIN_SUBDOMAIN:-admin}
      TENANT_ADMIN_HOSTS: ${TENANT_ADMIN_HOSTS:-}
      TENANT_ALLOW_ROOT_FOR_SUPER_ADMIN: ${TENANT_ALLOW_ROOT_FOR_SUPER_ADMIN:-false}
      TENANT_ALLOW_HEADER_OVERRIDE: ${TENANT_ALLOW_HEADER_OVERRIDE:-false}
      SUPER_ADMIN_EMAILS: ${SUPER_ADMIN_EMAILS:?SUPER_ADMIN_EMAILS is required}
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL is required}
      MAIL_MAILER: ${MAIL_MAILER:-smtp}
      MAIL_SCHEME: ${MAIL_SCHEME:-smtp}
      MAIL_HOST: ${MAIL_HOST:-smtp-relay.brevo.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-no-reply@example.com}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-EduSmart}
      EVOLUTION_API_BASE_URL: ${EVOLUTION_API_BASE_URL:-http://evolution_api:8080}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-}
      EVOLUTION_API_INTEGRATION: ${EVOLUTION_API_INTEGRATION:-WHATSAPP-BAILEYS}
      EVOLUTION_API_INSTANCE_PREFIX: ${EVOLUTION_API_INSTANCE_PREFIX:-edusmart}
      EVOLUTION_API_TIMEOUT_SECONDS: ${EVOLUTION_API_TIMEOUT_SECONDS:-20}
      EVOLUTION_API_VERIFY_SSL: ${EVOLUTION_API_VERIFY_SSL:-true}
    volumes:
      - backend_storage:/var/www/html/storage
      - backend_bootstrap_cache:/var/www/html/bootstrap/cache
    command: ["sh", "-lc", "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"]
    networks:
      - internal

  rfid_bridge:
    build:
      context: .
      dockerfile: backend/docker/Dockerfile.prod
    container_name: edusmart-rfid-bridge
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ROLE: rfid-bridge
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?APP_KEY is required}
      APP_URL: ${APP_URL:?APP_URL is required}
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL is required}
      LOG_CHANNEL: stack
      LOG_STACK: single
      LOG_LEVEL: info

      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:?DB_DATABASE is required}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}

      CACHE_STORE: redis
      SESSION_DRIVER: redis
      SESSION_CONNECTION: default
      QUEUE_CONNECTION: redis

      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}

      SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS:?SANCTUM_STATEFUL_DOMAINS is required}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-*}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
      CORS_ALLOWED_ORIGIN_PATTERNS: ${CORS_ALLOWED_ORIGIN_PATTERNS:-}

      TENANT_ROOT_DOMAIN: ${TENANT_ROOT_DOMAIN:?TENANT_ROOT_DOMAIN is required}
      TENANT_DEFAULT_SLUG: ${TENANT_DEFAULT_SLUG:-default}
      TENANT_ADMIN_SUBDOMAIN: ${TENANT_ADMIN_SUBDOMAIN:-admin}
      TENANT_ADMIN_HOSTS: ${TENANT_ADMIN_HOSTS:-}
      TENANT_ALLOW_ROOT_FOR_SUPER_ADMIN: ${TENANT_ALLOW_ROOT_FOR_SUPER_ADMIN:-false}
      TENANT_ALLOW_HEADER_OVERRIDE: ${TENANT_ALLOW_HEADER_OVERRIDE:-false}
      TENANT_RESERVED: ${TENANT_RESERVED:-www,app,api,admin}
      SUPER_ADMIN_EMAILS: ${SUPER_ADMIN_EMAILS:?SUPER_ADMIN_EMAILS is required}
      SUPER_ADMIN_IDS: ${SUPER_ADMIN_IDS:-}

      RFID_SCAN_SHARED_KEY: ${RFID_SCAN_SHARED_KEY:-}
      RFID_MQTT_BRIDGE_ENABLED: ${RFID_MQTT_BRIDGE_ENABLED:-true}
      RFID_MQTT_HOST: ${RFID_MQTT_HOST:-}
      RFID_MQTT_PORT: ${RFID_MQTT_PORT:-8883}
      RFID_MQTT_USERNAME: ${RFID_MQTT_USERNAME:-}
      RFID_MQTT_PASSWORD: ${RFID_MQTT_PASSWORD:-}
      RFID_MQTT_CLIENT_ID_PREFIX: ${RFID_MQTT_CLIENT_ID_PREFIX:-edusmart-rfid-bridge}
      RFID_MQTT_QOS: ${RFID_MQTT_QOS:-1}
      RFID_MQTT_USE_TLS: ${RFID_MQTT_USE_TLS:-true}
      RFID_MQTT_TLS_VERIFY_PEER: ${RFID_MQTT_TLS_VERIFY_PEER:-true}
      RFID_MQTT_TLS_VERIFY_PEER_NAME: ${RFID_MQTT_TLS_VERIFY_PEER_NAME:-true}
      RFID_MQTT_TLS_ALLOW_SELF_SIGNED: ${RFID_MQTT_TLS_ALLOW_SELF_SIGNED:-false}
      RFID_MQTT_SCAN_TOPIC_TEMPLATE: ${RFID_MQTT_SCAN_TOPIC_TEMPLATE:-edusmart/{tenant}/rfid/scan}
      RFID_MQTT_SCAN_TOPIC_FILTER: ${RFID_MQTT_SCAN_TOPIC_FILTER:-}
      RFID_MQTT_RESPONSE_TOPIC_TEMPLATE: ${RFID_MQTT_RESPONSE_TOPIC_TEMPLATE:-edusmart/{tenant}/rfid/response}
      RFID_MQTT_MODE_TOPIC_TEMPLATE: ${RFID_MQTT_MODE_TOPIC_TEMPLATE:-edusmart/{tenant}/rfid/mode}
      RFID_MQTT_DEFAULT_TENANT_SLUG: ${RFID_MQTT_DEFAULT_TENANT_SLUG:-}
      RFID_MQTT_DEVICE_TENANT_MAP: ${RFID_MQTT_DEVICE_TENANT_MAP:-{}}
      RFID_MQTT_MODE_SYNC_INTERVAL: ${RFID_MQTT_MODE_SYNC_INTERVAL:-20}
      RFID_MQTT_RECONNECT_DELAY: ${RFID_MQTT_RECONNECT_DELAY:-5}
    volumes:
      - backend_storage:/var/www/html/storage
      - backend_bootstrap_cache:/var/www/html/bootstrap/cache
    command: ["php", "artisan", "rfid:mqtt-bridge"]
    networks:
      - internal

  nginx:
    build:
      context: .
      dockerfile: deploy/nginx/Dockerfile.prod
      args:
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_TENANT_SLUG: ${VITE_TENANT_SLUG:-}
        VITE_ROOT_DOMAIN: ${VITE_ROOT_DOMAIN:-}
        VITE_ADMIN_SUBDOMAIN: ${VITE_ADMIN_SUBDOMAIN:-admin}
        VITE_REALTIME_POLL_MS: ${VITE_REALTIME_POLL_MS:-4000}
        VITE_REALTIME_POLL_HIDDEN_MS: ${VITE_REALTIME_POLL_HIDDEN_MS:-12000}
        VITE_GOOGLE_AUTH_ENABLED: ${VITE_GOOGLE_AUTH_ENABLED:-false}
        VITE_GOOGLE_AUTH_LOGIN_URL: ${VITE_GOOGLE_AUTH_LOGIN_URL:-/api/auth/google/redirect}
        VITE_GOOGLE_AUTH_LINK_URL: ${VITE_GOOGLE_AUTH_LINK_URL:-/api/auth/google/link}
    container_name: edusmart-nginx
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/api/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 10
    networks:
      - internal

  caddy:
    image: caddy:2.10.2-alpine
    container_name: edusmart-caddy
    restart: unless-stopped
    depends_on:
      nginx:
        condition: service_healthy
    environment:
      CADDY_ACME_EMAIL: ${CADDY_ACME_EMAIL:-admin@example.com}
      CADDY_ASK_SECRET: ${CADDY_ASK_SECRET:-}
      CADDY_EVOLUTION_HOST: ${CADDY_EVOLUTION_HOST:-evolution.localhost.invalid}
      CADDY_HTTPS_PORT_SUFFIX: ${CADDY_HTTPS_PORT_SUFFIX:-}
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD-SHELL", "caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - internal

volumes:
  postgres_data:
  redis_data:
  evolution_postgres_data:
  evolution_redis_data:
  evolution_instances:
  backend_storage:
  backend_bootstrap_cache:
  caddy_data:
  caddy_config:

networks:
  internal:
    driver: bridge
